function aviso(html){ document.getElementById('lerr').innerHTML='<div class="err">'+html+'</div>'; }

function telaConfig(){
  document.getElementById('lerr').innerHTML=
    `<div class="err">Falta apontar o sistema para o seu projeto do Supabase. Cole os dois valores de
      <b>Settings → API</b>. Eles ficam guardados neste aparelho.</div>
     <div class="fld"><label>URL do projeto</label><input id="cfu" placeholder="https://xxxx.supabase.co" value="${esc(guardado('ana_url'))}"></div>
     <div class="fld"><label>Chave anon public</label><input id="cfk" placeholder="eyJhbGc..." value="${esc(guardado('ana_key'))}"></div>
     <button class="btn" id="cfs" style="width:100%;margin-bottom:14px">Salvar e conectar</button>`;
  document.getElementById('cfs').addEventListener('click',()=>{
    const u=document.getElementById('cfu').value.trim().replace(/\/+$/,'');
    const k=document.getElementById('cfk').value.trim();
    if(!/^https:\/\/.+/.test(u)||!k){ aviso('Preencha os dois campos. A URL começa com https://'); return; }
    guardar('ana_url',u); guardar('ana_key',k);
    SUPABASE_URL=u; SUPABASE_ANON=k;
    partir();
  });
}

async function entrar(){
  if(!sb){ partir(); if(!sb) return; }
  const b=document.getElementById('lgo'); b.disabled=true; b.textContent='Entrando…';
  let r;
  try{
    r=await sb.auth.signInWithPassword({
      email:document.getElementById('lem').value.trim(),
      password:document.getElementById('lpw').value});
  }catch(e){
    b.disabled=false; b.textContent='Entrar';
    aviso('Não deu para falar com o servidor: '+esc(e.message)); return;
  }
  b.disabled=false; b.textContent='Entrar';
  if(r.error){
    aviso(/Invalid/i.test(r.error.message)?'E-mail ou senha não conferem.':esc(r.error.message));
    return;
  }
  iniciarApp();
}

/* liga tudo e diz na tela o que faltou, em vez de morrer em silêncio */
function partir(){
  const s=conectar();
  if(s==='biblioteca'){
    aviso('A biblioteca do Supabase não carregou. Abra pelo endereço da Vercel (não pelo arquivo no computador) e confira se algum bloqueador está barrando o cdn.jsdelivr.net.');
    return;
  }
  if(s==='configurar'){ telaConfig(); return; }
  if(s.indexOf('erro:')===0){ aviso('Endereço ou chave inválidos: '+esc(s.slice(5))); return; }
  document.getElementById('lerr').innerHTML='';
  sb.auth.getSession().then(r=>{ if(r.data.session) iniciarApp(); }).catch(e=>console.error(e));
}

/* ===================== tempo real ===================== */
// O tempo real já traz a linha alterada. Aplicar ela direto custa zero leitura;
// reler o dia inteiro custava cinco consultas por mudança, em cada aparelho aberto.
const DESTINO={fila:'fila', vendas:'vendas', atendimentos:'at', caixa_mov:'mov'};
// O painel guarda o mês inteiro em memória para não reler o banco a cada troca
// de aba. Só que nada envelhecia esse cache: uma aba aberta de manhã seguia
// mostrando o mês como estava naquela hora, por dias. Era isso que fazia o
// painel falar em 22 dias no dia 25. Agora qualquer gravação nessas tabelas
// marca o mês para reler, e se o painel estiver na tela ele se refaz na hora.
const NO_MES={vendas:1, atendimentos:1, caixa_mov:1, atend_manual:1, despesas:1, escala:1};
const TELAS_MES=['painel','despesas','meu','escala'];
let relerMes=0;   // junta uma rajada de vendas numa única releitura
function aplicarMudanca(tabela, p){
  const linha=p.new&&Object.keys(p.new).length?p.new:null;
  const velha=p.old&&Object.keys(p.old).length?p.old:null;
  if(NO_MES[tabela]){
    const d=(linha&&linha.data)||(velha&&velha.data)||'';
    if(String(d).slice(0,7)===mesPainel){
      mesCarregado='';
      if(TELAS_MES.indexOf(atual)>=0){
        clearTimeout(relerMes);
        relerMes=setTimeout(()=>carregarMes()
          .then(()=>{ if(!MD.classList.contains('on')) render(); }), 1200);
      }
    }
  }
  const campo=DESTINO[tabela]; if(!campo) return;
  const arr=D[campo]; if(!arr) return;
  const mesma = tabela==='fila'
    ? (x,y)=>x.vendedora===y.vendedora
    : (x,y)=>x.id===y.id;
  if(p.eventType==='DELETE'){
    if(!velha) return;
    const i=arr.findIndex(x=>mesma(x,velha));
    if(i>=0) arr.splice(i,1);
  } else {
    if(!linha) return;
    if(linha.loja_id!==loja) return;
    if(linha.data && linha.data!==dia) return;
    const i=arr.findIndex(x=>mesma(x,linha));
    if(i>=0) arr[i]=linha; else arr.push(linha);
  }
  if(!MD.classList.contains('on')) render();
}
function ligarCanal(){
  if(canal) sb.removeChannel(canal);
  const liga=(c,t)=>c.on('postgres_changes',{event:'*',schema:'public',table:t},p=>aplicarMudanca(t,p));
  let c=sb.channel('salao');
  ['fila','vendas','atendimentos','caixa_mov'].forEach(t=>{ c=liga(c,t); });
  canal=c.subscribe();
}

/* ===================== boot ===================== */
async function iniciarApp(){
  try{
    const s=await sb.auth.getUser();
    if(!s.data.user) return;
    await carregarBase();
    const me=pessoas.find(p=>p.user_id===s.data.user.id);
    if(!me){
      document.getElementById('lerr').innerHTML='<div class="err">Login criado, mas ainda não ligado a uma pessoa. Amarre o e-mail em pessoas.user_id.</div>';
      await sb.auth.signOut(); return;
    }
    eu={nome:me.nome,papel:me.papel,loja_id:me.loja_id};
    loja = me.loja_id || (lojas[0]&&lojas[0].id);
    document.getElementById('login').classList.add('off');
    document.getElementById('app').classList.add('on');
    await carregarDia();
    await carregarMes();
    render();
    ligarCanal();
    let hojeRef=hoje();
    setInterval(async ()=>{
      if(MD.classList.contains('on')) return;
      const h=hoje();
      if(h!==hojeRef){
        // só arrasta a data se ninguém tinha escolhido outro dia de propósito
        if(dia===hojeRef){ dia=h; mesPainel=ym(dia); await carregarDia(); toast('Virou o dia — agora é '+labelDia(h)); }
        hojeRef=h;
      }
      if(atual==='fila') render();
    },60000);
  }catch(err){
    document.getElementById('lerr').innerHTML='<div class="err">'+esc(err.message||'Falha ao carregar os dados.')+'</div>';
  }
}
partir();
</script>
