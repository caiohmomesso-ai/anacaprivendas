<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Anacapri — Gestão de vendas · demonstração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2E2724; --muted:#726A64; --faint:#A39A92;
  --line:#E6DFD7; --line2:#F1ECE6; --bg:#FAF7F3; --surface:#FFFFFF; --sand:#F2E9DE;
  --marca:#8E3B5D; --marca-esc:#73304C; --marca-soft:#F8EDF1;
  --ok:#2A7F62; --ok-soft:#E9F3EF;
  --warn:#9A7018; --warn-soft:#FAF2E0;
  --bad:#B23A31; --bad-soft:#FBEEEC;
  --busy:#3D6BB0; --busy-soft:#ECF1F9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

#app{display:none;min-height:100vh}
#app.on{display:flex}
#rail{width:230px;flex:0 0 230px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:0 8px 18px;border-bottom:1px solid var(--line2);margin-bottom:14px}
.brand b{font-family:Jost,sans-serif;font-weight:400;font-size:20px;letter-spacing:.30em;display:block;text-transform:uppercase;color:var(--marca)}
.brand span{color:var(--faint);font-size:11.5px}
#navs{flex:1}
.navb{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;margin-bottom:2px;background:none;border:0;border-radius:6px;cursor:pointer;text-align:left;color:var(--muted);font-size:14px}
.navb:hover{background:var(--line2);color:var(--ink)}
.navb.on{background:var(--marca);color:#fff;font-weight:500}
.navb i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;flex:0 0 6px}
.navb.on i{opacity:1}
main{flex:1;min-width:0;padding:24px 26px 90px}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-family:Jost,sans-serif;font-weight:400;font-size:27px;margin:0}
.head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.spacer{flex:1}

.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11.5px;color:var(--faint)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 9px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--marca);box-shadow:0 0 0 3px var(--marca-soft)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.btn{background:var(--marca);color:#fff;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--marca-esc);opacity:1}
.btn:disabled{opacity:.4;cursor:default}
.btn.gh{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.gh:hover{background:var(--line2);opacity:1}
.btn.sm{padding:6px 11px;font-size:13px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{background:none;border:0;border-radius:5px;padding:7px 14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--marca);color:#fff}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card > h3{margin:0;padding:12px 15px;border-bottom:1px solid var(--line2);font-size:13.5px;font-weight:600}
.pad{padding:15px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}

table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--faint);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line2)}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right}
tr.tot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0;background:var(--sand)}
.del{background:none;border:0;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:2px 5px;border-radius:5px}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:3px;background:var(--line2);color:var(--muted)}
.tag.g{background:var(--ok-soft);color:var(--ok)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.k{background:var(--marca);color:#fff}

.entry{display:grid;grid-template-columns:86px 1fr 1fr 104px 52px 52px 52px 1fr 1.4fr 46px;gap:8px;align-items:end}
.recon{display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:10px;border:1px solid;flex-wrap:wrap}
.recon.ok{background:var(--ok-soft);border-color:#C6DED5;color:var(--ok)}
.recon.off{background:var(--warn-soft);border-color:#E6D9B8;color:var(--warn)}
.recon b{font-size:19px;font-family:Jost,sans-serif;font-weight:500}
.recon .lbl{color:var(--muted);font-size:12.5px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:Jost,sans-serif;font-weight:400;font-size:28px;margin:2px 0 6px}
.bar{height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--marca)}
.bar i.ok{background:var(--ok)}
.pct{font-size:12px;color:var(--muted);margin-top:5px}
.pct b{color:var(--ink)}
.up{color:var(--ok)} .dn{color:var(--bad)}
.chart{display:flex;align-items:flex-end;gap:2px;height:104px;padding:0 2px}
.chart div{flex:1;background:var(--marca);opacity:.30;border-radius:2px 2px 0 0;min-height:2px}
.chart div.hi{opacity:1}
.xlab{display:flex;gap:2px;padding:5px 2px 0}
.xlab span{flex:1;text-align:center;font-size:9.5px;color:var(--faint)}
.empty{padding:34px 15px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:3px}
.note{font-size:12.5px;color:var(--muted);margin-top:9px}

.subnav{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 15px;
  cursor:pointer;color:var(--muted);font-size:14px;white-space:nowrap;margin-bottom:-1px}
.subnav button:hover{color:var(--ink)}
.subnav button.on{color:var(--marca);border-bottom-color:var(--marca);font-weight:500}
.fila{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col > h3{display:flex;align-items:center;gap:8px}
.col > h3 em{font-style:normal;margin-left:auto;font-weight:600;font-size:12px;color:var(--faint)}
.col.disp > h3{background:var(--ok-soft);color:var(--ok);border-radius:10px 10px 0 0}
.col.atend > h3{background:var(--busy-soft);color:var(--busy);border-radius:10px 10px 0 0}
.col.indisp > h3{background:var(--warn-soft);color:var(--warn);border-radius:10px 10px 0 0}
.pes{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line2)}
.pes:last-child{border-bottom:0}
.pes.vez{background:var(--marca-soft)}
.av{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:13.5px;background:var(--line2);color:var(--muted);font-family:Jost,sans-serif}
.pes.vez .av{background:var(--marca);color:#fff}
.pes .i{flex:1;min-width:0}
.pes .i b{display:block;font-weight:600}
.pes .i span{font-size:11.5px;color:var(--muted)}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:12.5px}
.ib:hover{background:var(--line2)}
.ib.go{background:var(--marca);border-color:var(--marca);color:#fff}
.ib.stop{background:var(--surface);border-color:var(--marca);color:var(--marca);font-weight:500}
.ib.back{background:var(--ok);border-color:var(--ok);color:#fff}

#modal{position:fixed;inset:0;background:rgba(46,39,36,.45);display:none;place-items:center;z-index:60;padding:16px}
#modal.on{display:grid}
.sheet{background:var(--surface);border-radius:12px;width:min(470px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet h4{margin:0;padding:15px 18px;border-bottom:1px solid var(--line2);font-size:15px;font-weight:600}
.sheet .bd{padding:18px;display:grid;gap:13px}
.sheet .ft{padding:0 18px 18px;display:flex;gap:9px}
.sheet .ft .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.chk{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{width:auto}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pick button{padding:17px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px}
.pick button.s{background:var(--ok);border-color:var(--ok);color:#fff}
.pick button.n{background:var(--bad);border-color:var(--bad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 13px;cursor:pointer;font-size:12.5px}

#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:22px;z-index:80}
#login.off{display:none}
.lx{width:min(370px,100%);text-align:center}
.lx .wm{font-family:Jost,sans-serif;font-weight:300;font-size:30px;letter-spacing:.34em;text-transform:uppercase;margin-bottom:6px;color:var(--marca)}
.lx .sb{color:var(--muted);margin-bottom:26px;font-size:13px}
.lx .fld{text-align:left;margin-bottom:11px}
.lx .btn{width:100%;padding:11px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:12px;text-align:left}
#who{border-top:1px solid var(--line2);padding-top:12px}
#who .trocar{width:100%;background:none;border:1px solid var(--line);border-radius:7px;padding:9px 10px;cursor:pointer;text-align:left}
#who .trocar b{display:block;font-size:13px}
#who .trocar span{font-size:11.5px;color:var(--faint)}

.meucard{display:flex;align-items:center;gap:13px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;padding:15px 17px;margin-bottom:14px}
.meucard.vez{border-color:var(--marca);background:var(--marca-soft)}
.acao{background:var(--marca);color:#fff;border:0;border-radius:8px;padding:13px 22px;
  font-size:15px;font-weight:500;cursor:pointer}
.acao:hover{background:var(--marca-esc)}
.acao.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.acao.alt:hover{background:var(--line2)}
.dica{font-size:12.5px;color:var(--muted);background:var(--marca-soft);border-radius:7px;padding:9px 12px;min-height:14px}
.dica:empty{display:none}
.dica b{color:var(--marca)}
.pcx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;
  cursor:pointer;text-align:left;width:100%}
.pcx:hover{border-color:var(--marca);background:var(--marca-soft)}
.pcx b{display:block;font-size:14px;margin-bottom:2px}
.pcx span{font-size:11.5px;color:var(--muted)}
.pcx{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;
  cursor:pointer;text-align:left;width:100%}
.pcx:hover{border-color:var(--marca);background:var(--marca-soft)}
.pcx b{display:block;font-size:14px;margin-bottom:2px}
.pcx span{font-size:11.5px;color:var(--muted)}
#fitademo{position:sticky;top:0;z-index:30;background:var(--marca);color:#fff;
  padding:6px 14px;font-size:12px;display:flex;gap:10px;align-items:center}
#fitademo b{font-weight:600}
#fitademo button{margin-left:auto;background:rgba(255,255,255,.18);border:0;color:#fff;
  border-radius:5px;padding:4px 11px;cursor:pointer;font-size:12px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--marca-esc);color:#fff;padding:11px 18px;border-radius:7px;transition:transform .22s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.up{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* CRM de bônus */
.chips-p{display:flex;gap:7px;flex-wrap:wrap}
.chips-p button{border:1px solid var(--line);background:var(--surface);border-radius:22px;
  padding:8px 17px;cursor:pointer;font-size:13px;color:var(--muted)}
.chips-p button.on{background:var(--marca);border-color:var(--marca);color:#fff;font-weight:500}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
.bcard .tp{display:flex;align-items:baseline;gap:8px}
.bcard .tp b{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.bcard .tp span{color:var(--muted);font-size:12.5px}
.bcard .tp .sp{flex:1}
.bcard .vl{font-family:Jost,sans-serif;font-size:33px;font-weight:400;margin:5px 0 3px}
.bcard .vl em{font-style:normal;font-size:15px;color:var(--faint);margin-right:3px}
.bcard .rd{font-size:12.5px;color:var(--muted)}
.bcard.ger{border-left:3px solid var(--marca)}
.bcard.res{border-left:3px solid var(--ok)}
.bcard.per{border-left:3px solid var(--bad)}
.bcard.ven{border-left:3px solid var(--warn)}

/* grade de escala */
.esc-wrap{overflow-x:auto}
.esc{border-collapse:separate;border-spacing:0;min-width:100%}
.esc th,.esc td{padding:0;border:0}
.esc .nm{position:sticky;left:0;background:var(--surface);z-index:2;padding:6px 12px;
  border-right:1px solid var(--line);white-space:nowrap;text-align:left;font-weight:500;min-width:132px}
.esc thead .nm{background:var(--surface);color:var(--faint);font-size:11.5px;font-weight:500}
.esc .dh{width:30px;text-align:center;font-size:10.5px;color:var(--faint);padding:4px 0;line-height:1.15}
.esc .dh b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.esc .dh.dom{background:var(--line2);border-radius:5px 5px 0 0}
.esc td.cl{width:30px;height:30px;text-align:center;cursor:pointer;font-size:11px;font-weight:600;
  border:1px solid var(--surface);border-radius:4px;color:var(--muted);background:var(--line2)}
.esc td.cl:hover{outline:2px solid var(--marca);outline-offset:-2px}
.esc td.cl.dom{background:#E8E4DE}
.esc td.v-I{background:var(--marca);color:#fff}
.esc td.v-M{background:var(--busy);color:#fff}
.esc td.v-T{background:#6E8FC9;color:#fff}
.esc td.v-F{background:var(--sand);color:var(--muted)}
.esc td.v-FE{background:var(--warn-soft);color:var(--warn)}
.esc td.v-AT{background:var(--bad-soft);color:var(--bad)}
.esc td.falta{box-shadow:inset 0 -3px 0 var(--bad)}
.esc .tot{padding:0 10px;text-align:right;font-weight:600;white-space:nowrap}
.leg{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:5px;vertical-align:-2px}

#mwho{display:none;align-items:center;gap:8px;margin-bottom:13px}
@media(max-width:900px){
  #app.on{display:block}
  #rail{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;flex-direction:row;gap:4px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:20}
  .brand,#who{display:none}
  #navs{display:flex;gap:4px;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #navs::-webkit-scrollbar{display:none}
  .navb{flex:0 0 auto;min-width:66px}
  .navb{flex-direction:column;gap:3px;justify-content:center;font-size:10.5px;padding:6px 2px;margin:0;text-align:center;flex:1}
  .navb i{width:5px;height:5px;flex:0 0 5px}
  main{padding:16px 13px 96px}
  .grid2,.fila{grid-template-columns:1fr}
  .entry{grid-template-columns:1fr 1fr;gap:9px}
  .entry .wide{grid-column:1/-1}
  .head h1{font-size:23px}
  #mwho{display:flex}
}
</style>

<div id="login"><div class="lx" style="width:min(520px,100%)">
  <div class="wm">Anacapri</div>
  <div class="sb">Gestão de vendas · demonstração</div>
  <div id="lerr"></div>
  <p style="text-align:left;font-size:13px;color:var(--muted);margin:0 0 16px">
    Dados de exemplo, gerados no seu navegador. Pode lançar venda, encerrar atendimento,
    fazer sangria e mexer na escala à vontade — nada sai daqui, e recarregar a página apaga tudo.
    Escolha por qual perfil quer entrar.</p>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:left">
    <button class="pcx" data-demo="u_caio"><b>Caio</b><span>Proprietário · as duas lojas</span></button>
    <button class="pcx" data-demo="u_amanda"><b>Amanda</b><span>Gerente · PSB</span></button>
    <button class="pcx" data-demo="u_erika"><b>Erika</b><span>Vendedora · PSB</span></button>
    <button class="pcx" data-demo="u_tablet"><b>Tablet do Tamboré</b><span>Conta do aparelho</span></button>
  </div>
  <div style="display:none">
    <input id="lem"><input id="lpw"><button id="lgo"></button>
  </div>
</div></div>

<div id="app">
  <div id="fitademo" style="display:none"></div>
  <nav id="rail">
    <div class="brand"><b>Anacapri</b><span>Gestão de vendas</span></div>
    <div id="navs"></div>
    <div id="who"></div>
  </nav>
  <main id="view"></main>
</div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
/* ============ modo demonstração: banco falso, tudo na memória ============ */
(function(){
  const DB={}; let seq=1;
  const TETO=1000;   // o mesmo teto por resposta que o Supabase aplica
  const uid=()=>'d'+(seq++).toString(36).padStart(7,'0');
  const ok=d=>({data:d,error:null});
  const tbl=n=>DB[n]||(DB[n]=[]);
  function builder(nome){
    const F=[]; let op='select',carga=null,conf=null,ord=[],lim=null,um=null,faixa=null;
    const api={}; const mais=f=>{F.push(f);return api;};
    api.select=()=>api;
    api.insert=v=>{op='insert';carga=v;return api;};
    api.update=v=>{op='update';carga=v;return api;};
    api.upsert=(v,o)=>{op='upsert';carga=v;conf=((o&&o.onConflict)||'').split(',').map(x=>x.trim()).filter(Boolean);return api;};
    api.delete=()=>{op='delete';return api;};
    api.eq=(c,v)=>mais(r=>r[c]===v);
    api.neq=(c,v)=>mais(r=>r[c]!==v);
    api.is=(c,v)=>mais(r=>(r[c]==null)===(v==null));
    api.in=(c,a)=>mais(r=>a.indexOf(r[c])>=0);
    api.gte=(c,v)=>mais(r=>r[c]>=v);
    api.lte=(c,v)=>mais(r=>r[c]<=v);
    api.gt=(c,v)=>mais(r=>r[c]>v);
    api.lt=(c,v)=>mais(r=>r[c]<v);
    api.ilike=(c,v)=>{const t=String(v).replace(/%/g,'').toUpperCase();
      return mais(r=>String(r[c]||'').toUpperCase().indexOf(t)>=0);};
    api.match=o=>{Object.keys(o).forEach(k=>mais(r=>r[k]===o[k]));return api;};
    // ordem por várias colunas, como o banco de verdade

/* O banco devolve no máximo mil linhas por consulta, e não avisa quando corta.
   Com as duas lojas juntas, novembro já passou disso: 1.059 vendas. O que
   sobrava ficava de fora em silêncio, e eram sempre as linhas mais recentes —
   por isso o painel mostrava 22 dias em vez de 24.
   Daqui para frente toda consulta que pode crescer vem em páginas de mil,
   até o banco acabar. A ordem é sempre explícita: sem ela o Postgres pode
   devolver a mesma linha em duas páginas e esquecer outra. */
const PAGINA=1000;
async function tudo(montar, ordem){
  const cols = ordem || ['id'];
  const fora=[];
  for(let ini=0; ; ini+=PAGINA){
    let q=montar();
    cols.forEach(c=>{ q=q.order(c); });
    const r=await q.range(ini, ini+PAGINA-1);
    if(r.error) return {data:null, error:r.error};
    const lote=r.data||[];
    fora.push(...lote);
    if(lote.length<PAGINA) break;
    if(fora.length>=200000) break;   // trava de segurança
  }
  return {data:fora, error:null};
}

function apura(linhas){
  const r={venda:0,s:0,b:0,a:0,tickets:0,porPag:{},porCanal:{}};
  const bol=new Set();
  linhas.forEach((v,i)=>{
    r.venda+= +v.total; r.s+=v.sapatos||0; r.b+=v.bolsas||0; r.a+=v.acessorios||0;
    r.porPag[v.pagamento]=(r.porPag[v.pagamento]||0)+ +v.total;
    r.porCanal[v.canal]=(r.porCanal[v.canal]||0)+ +v.total;
    bol.add(v.boleta?'B'+v.boleta+'|'+v.vendedora:'L'+(v.id||i));
  });
  r.tickets=bol.size; r.pecas=r.s+r.b+r.a;
  r.va=r.tickets?r.venda/r.tickets:0;
  r.pa=r.tickets?r.pecas/r.tickets:0;
  r.bs=r.s?r.b/r.s*100:0;
  return r;
}

  if(venda&&venda.length){

    if(rv.error) return erro(rv.error);
    D.vendas.push(...rv.data);
    toast('Venda de R$ '+brl(dados.valor)+' lançada para '+nome);
  }
  const upd={fim:new Date().toISOString()}; Object.assign(upd,dados);
  const r=await sb.from('atendimentos').update(upd).eq('id',a.id).select().single();
  if(r.error) return erro(r.error);
  Object.assign(a,r.data);
  await mudarFila(nome,'disp');
}

  document.getElementById('view').innerHTML=mob+telas[atual]();

async function nav(t){
  atual=t;
  if(['painel','despesas','meu','escala'].indexOf(t)>=0) await carregarMes();
  if(t==='bonus'&&!B.carregado) await carregarBonus();
  if(t==='bonus'&&B.carregado&&B.mes!==mesPainel){ B.mes=mesPainel; await carregarBonus(); }
  if(t==='relatorio'&&!R.de){ R.ate=hoje(); R.de=hoje().slice(0,8)+'01'; }
  render();
}

/* ===================== tela: escala ===================== */
telas.escala = () => {
  const nD=diasNoMes(mesPainel), ano=+mesPainel.slice(0,4), mm=+mesPainel.slice(5,7);
  const eq=equipe(loja);
  const mapa={};
  M.esc.filter(e=>e.loja_id===loja).forEach(e=>mapa[e.vendedora+'|'+e.data]=e.turno);
  const vd=M.vendas.filter(v=>v.loja_id===loja);
  const ats=M.at.filter(a=>a.loja_id===loja&&a.fim), ams=M.am.filter(a=>a.loja_id===loja);
  const ativo={};
  vd.forEach(v=>ativo[v.vendedora+'|'+v.data]=1);
  ats.forEach(a=>ativo[a.vendedora+'|'+a.data]=1);
  ams.filter(a=>+a.qtd>0).forEach(a=>ativo[a.vendedora+'|'+a.data]=1);

  const dias=[];
  for(let d=1;d<=nD;d++){
    const dt=mesPainel+'-'+String(d).padStart(2,'0');
    dias.push({d,dt,sem:new Date(ano,mm-1,d).getDay()});
  }
  const cabDias=dias.map(x=>`<th class="dh ${x.sem===0?'dom':''}"><b>${x.d}</b>${SEM[x.sem]}</th>`).join('');

  const linhas=eq.map(v=>{
    const p=presenca(loja,v.nome,vd,ats,ams,M.esc);
    return `<tr><td class="nm">${esc(v.nome)}
        <div style="font-size:11px;color:var(--faint);font-weight:400">${p.escalados} escalados${p.faltou?' · '+p.faltou+' sem movimento':''}</div></td>
      ${dias.map(x=>{
        const t=mapa[v.nome+'|'+x.dt]||'';
        const falta = TRABALHA.indexOf(t)>=0 && !ativo[v.nome+'|'+x.dt] && x.dt<=hoje();
        return `<td class="cl ${t?'v-'+t:(x.sem===0?'dom':'')} ${falta?'falta':''}"
          data-esc="${esc(v.nome)}|${x.dt}" title="${esc(v.nome)} · ${x.d}/${mm}${t?' · '+esc((TURNOS.find(z=>z.k===t)||{}).t):''}${falta?' · escalada sem nenhum movimento':''}">${t}</td>`;
      }).join('')}
      <td class="tot num">${p.escalados}</td></tr>`;
  }).join('');

  const cobertura=dias.map(x=>eq.filter(v=>TRABALHA.indexOf(mapa[v.nome+'|'+x.dt]||'')>=0).length);
  const maxC=Math.max(1,...cobertura);

  return `
  <div class="head"><div><h1>Escala de ${labelMes(mesPainel)}</h1>
    <p>Escolha o turno e clique nos dias. Clicar de novo no mesmo turno apaga.</p></div>
    <div class="spacer"></div>${selLoja()}${selMes()}</div>

  <div class="card" style="margin-bottom:14px"><div class="pad">
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
      <div class="seg">${TURNOS.map(t=>`<button data-pin="${t.k}" class="${pincel===t.k?'on':''}">${t.t}</button>`).join('')}</div>
      <div class="spacer"></div>
      <button class="btn gh sm" id="es_semana">Preencher dias úteis com o turno escolhido</button>
      <button class="btn gh sm" id="es_limpa">Limpar o mês</button>
    </div>
  </div></div>

  <div class="card" style="margin-bottom:14px">
    <h3>Grade — clique para marcar</h3>
    <div class="esc-wrap"><table class="esc">
      <thead><tr><th class="nm">Vendedora</th>${cabDias}<th class="dh">tot</th></tr></thead>
      <tbody>${linhas || '<tr><td class="empty" colspan="33">Nenhuma vendedora cadastrada nesta loja</td></tr>'}</tbody>
    </table></div>
    <div class="pad" style="border-top:1px solid var(--line2)">
      <div class="leg">
        ${TURNOS.map(t=>`<span><i class="v-${t.k}" style="background:${
          {I:'var(--marca)',M:'var(--busy)',T:'#6E8FC9',F:'var(--sand)',FE:'var(--warn-soft)',AT:'var(--bad-soft)'}[t.k]}"></i>${t.t}</span>`).join('')}
        <span><i style="background:var(--line2);box-shadow:inset 0 -3px 0 var(--bad)"></i>escalada sem nenhum movimento</span>
      </div>
    </div>
  </div>

  <div class="grid2">
    <div class="card"><h3>Cobertura por dia</h3>
      <div class="pad"><div class="chart">${dias.map((x,i)=>
        `<div style="height:${Math.max(3,cobertura[i]/maxC*100)}%" title="${x.d}/${mm} — ${cobertura[i]} pessoa${cobertura[i]===1?'':'s'}"></div>`).join('')}</div>
        <div class="xlab">${dias.map(x=>`<span>${x.d}</span>`).join('')}</div>
        <p class="note">Quantas pessoas estão escaladas em cada dia do mês.</p></div></div>
    <div class="card"><h3>Resumo</h3><table>
      <thead><tr><th>Vendedora</th><th class="r">Escala</th><th class="r">Folga</th><th class="r">Férias</th><th class="r">Atest.</th></tr></thead>
      <tbody>${eq.map(v=>{const p=presenca(loja,v.nome,vd,ats,ams,M.esc);
        return `<tr><td>${esc(v.nome)}</td><td class="r num">${p.escalados}</td>
          <td class="r num">${p.folga||''}</td><td class="r num">${p.ferias||''}</td>
          <td class="r num">${p.atest||''}</td></tr>`;}).join('')}
      </tbody></table></div>
  </div>`;
};


/* ===================== tela: CRM de bônus ===================== */
telas.bonus = () => {
  const r=regras(), h=hoje();
  const meus = B.bonus.filter(b=>b.loja_id===loja);

  // período dos cartões
  const P=B.periodo;
  let de=B.de, ate=B.ate;
  if(P!=='esp'){
    const d=new Date(h+'T12:00:00');
    const iso=x=>new Date(x-x.getTimezoneOffset()*60000).toISOString().slice(0,10);
    if(P==='hoje'){ de=ate=h; }
    else if(P==='ontem'){ d.setDate(d.getDate()-1); de=ate=iso(d); }
    else if(P==='7'){ ate=h; d.setDate(d.getDate()-6); de=iso(d); }
    else if(P==='30'){ ate=h; d.setDate(d.getDate()-29); de=iso(d); }
    else if(P==='mes'){ de=h.slice(0,8)+'01'; ate=fimDoMes(h.slice(0,7)); }
    else if(P==='ant'){ d.setDate(1); d.setMonth(d.getMonth()-1);
      const m=iso(d).slice(0,7); de=m+'-01'; ate=fimDoMes(m); }
  }
  const noPer = x => x && x>=de && x<=ate;

  const ger = meus.filter(b=>noPer(b.data));
  const res = meus.filter(b=>noPer(b.resgatado_em));
  const per = meus.filter(b=>!b.resgatado_em && noPer(b.vence_em) && b.vence_em<h);
  const venc= meus.filter(b=>estadoBonus(b)==='ativo' || estadoBonus(b)==='bloqueado');
  const som = a => a.reduce((x,y)=>x+ +y.valor_bonus,0);
  const vendaGer = ger.reduce((x,y)=>x+ +y.valor_venda,0);
  const retorno = (som(res)+som(per))>0 ? som(res)/(som(res)+som(per))*100 : 0;

  // busca de cliente
  const q=B.busca.trim().toUpperCase(), qd=q.replace(/\D/g,'');
  const achados = q ? B.clientes.filter(c=>c.loja_id===loja &&
      (c.nome.indexOf(q)>=0 || (qd && (c.telefone||'').indexOf(qd)>=0))) : [];

  const linhaBonus = b => {
    const st=estadoBonus(b), podeRes = st==='ativo';
    return `<tr>
      <td class="num">${labelDia(b.data)}</td>
      <td><b>${esc(nomeCli(b.cliente_id))}</b>${telCli(b.cliente_id)?`<div style="font-size:11px;color:var(--faint)">${esc(telCli(b.cliente_id))}</div>`:''}</td>
      <td class="r num">${brl(b.valor_venda)}</td>
      <td class="r num"><b>${brl(b.valor_bonus)}</b></td>
      <td class="num" style="color:var(--muted)">${esc(b.boleta||'—')}</td>
      <td><span class="tag ${CLS[st]}">${ROT[st]}</span></td>
      <td class="num" style="color:var(--muted);font-size:12.5px">
        ${st==='resgatado'?labelDia(b.resgatado_em)
          :st==='bloqueado'?'libera '+labelDia(b.libera_em)
          :'vence '+labelDia(b.vence_em)}</td>
      <td class="r">${podeRes?`<button class="ib" data-res="${b.id}">Resgatar</button>`:''}</td></tr>`;
  };

  const porPag=10, tot=Math.ceil(ger.length/porPag)||1;
  const pag=Math.min(B.pag,tot-1);
  const fatia=ger.slice().sort((a,b)=>a.data<b.data?1:-1).slice(pag*porPag,(pag+1)*porPag);

  return `
  <div class="head"><div><h1>${opera()?"CRM de bônus":"Bônus da cliente"}</h1>
    <p>${opera()?`${r.pct}% da venda · libera em ${r.libera} dias · vale ${r.validade} dias · resgate com compra de ${dec(r.mult,0)}× o bônus`
      :'Busque pelo nome ou telefone para ver o saldo da cliente'}</p></div>
    <div class="spacer"></div>${selLoja()}</div>

  ${!opera()?'':`<div class="card" style="margin-bottom:14px"><div class="pad">
    <div class="chips-p">
      ${[['hoje','Hoje'],['ontem','Ontem'],['7','7 dias'],['30','30 dias'],['mes','Esse mês'],['ant','Mês passado'],['esp','Específico']]
        .map(x=>`<button data-bp="${x[0]}" class="${P===x[0]?'on':''}">${x[1]}</button>`).join('')}
    </div>
    ${P==='esp'?`<div class="entry" style="grid-template-columns:150px 150px auto;margin-top:12px">
      <div class="fld"><label>De</label><input type="date" id="bp_de" value="${de}"></div>
      <div class="fld"><label>Até</label><input type="date" id="bp_ate" value="${ate}"></div>
      <button class="btn" id="bp_go">Aplicar</button></div>`:''}
  </div></div>`}

  ${!opera()?'':`<div class="kpis" style="margin-bottom:14px">
    <div class="bcard ger"><div class="tp"><b>Bônus gerado</b><div class="sp"></div><span>${ger.length} ticket${ger.length===1?'':'s'}</span></div>
      <div class="vl num"><em>R$</em>${brl(som(ger))}</div>
      <div class="rd">Venda de R$ ${brl(vendaGer)}${vendaGer?' · '+dec(som(ger)/vendaGer*100,1)+'%':''}</div></div>
    <div class="bcard res"><div class="tp"><b>Bônus resgatado</b><div class="sp"></div><span>${res.length} ticket${res.length===1?'':'s'}</span></div>
      <div class="vl num"><em>R$</em>${brl(som(res))}</div>

const LAYOUTS={
  vendas:{titulo:'Vendas', cols:'data · vendedora · boleta · pagamento · total · sapatos · bolsas · acessorios · canal · obs',
    exemplo:'data\tvendedora\tboleta\tpagamento\ttotal\tsapatos\tbolsas\tacessorios\tcanal\tobs\n01/09/2026\tERIKA\t17310\tPIX\t189,90\t1\t0\t0\tLOJA\t'},
  escala:{titulo:'Escala', cols:'data · vendedora · turno (Integral, Manhã, Tarde, Folga, Férias, Atestado)',
    exemplo:'data\tvendedora\tturno\n01/09/2026\tERIKA\tIntegral\n01/09/2026\tLAURA\tFolga'},
  atendimentos:{titulo:'Atendimentos', cols:'data · vendedora · quantidade',
    exemplo:'data\tvendedora\tquantidade\n01/09/2026\tERIKA\t14'},
  bonus:{titulo:'Clientes e bônus', cols:'data · cliente · telefone · venda · bonus (opcional) · ticket (opcional)',
    exemplo:'data\tcliente\ttelefone\tvenda\tbonus\tticket\n30/09/2026\tMARIA\t17999998888\t229,90\t34,49\t00026724'}
};
const TURNO_TXT={INTEGRAL:'I',I:'I',MANHA:'M',MANHÃ:'M',M:'M',TARDE:'T',T:'T',FOLGA:'F',F:'F',
  FERIAS:'FE','FÉRIAS':'FE',FE:'FE',ATESTADO:'AT',AT:'AT',FALTA:'AT'};

function chave(x){ return String(x||'').trim().toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''); }
function dataBR(v){
  const t=String(v||'').trim();
  let m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let a=m[3]; if(a.length===2) a='20'+a;
    return a+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
  m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m?m[0]:'';
}
function lerColado(txt){
  const linhas=txt.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if(linhas.length<2) return {erro:'Cole o cabeçalho e pelo menos uma linha.'};
  const sep = linhas[0].indexOf('\t')>=0 ? '\t' : (linhas[0].indexOf(';')>=0 ? ';' : ',');
  const cab = linhas[0].split(sep).map(chave);
  return {cab, corpo: linhas.slice(1).map(l=>l.split(sep))};
}
function conferirImport(){
  IMP.linhas=[]; IMP.erros=[]; IMP.lido=false;
  const r=lerColado(IMP.texto);
  if(r.erro){ IMP.erros.push({l:0, msg:r.erro}); IMP.lido=true; return; }
  const idx = nomes => { for(const n of nomes){ const i=r.cab.indexOf(chave(n)); if(i>=0) return i; } return -1; };
  const eq = equipe(loja).map(v=>v.nome);
  const iData=idx(['data','dia']), iVen=idx(['vendedora','vendedor','vendedora(a)','nome']);
  r.corpo.forEach((c,n)=>{
    const ln=n+2, pega=i=>i>=0?String(c[i]||'').trim():'';
    const data=dataBR(pega(iData));
    if(!data){ IMP.erros.push({l:ln,msg:'data inválida'}); return; }

    if(IMP.tipo==='bonus'){
      const iCli=idx(['cliente','nome']), iTel=idx(['telefone','celular','fone']);
      const iVal=idx(['venda','valor','valordavenda']), iBon=idx(['bonus','bônus','bonusgerado']);
      const iTk=idx(['ticket','boleta','cupom']);
      const nome=pega(iCli).toUpperCase(), val=num(pega(iVal));
      if(!nome){ IMP.erros.push({l:ln,msg:'cliente em branco'}); return; }
      if(!val){ IMP.erros.push({l:ln,msg:'valor da venda inválido'}); return; }
      IMP.linhas.push({data, nome, tel:pega(iTel).replace(/\D/g,''), valor:val,
        bonus:num(pega(iBon)), ticket:pega(iTk)});
      return;
    }

    const vend=pega(iVen).toUpperCase();
    if(!vend){ IMP.erros.push({l:ln,msg:'vendedora em branco'}); return; }
    if(eq.indexOf(vend)<0){ IMP.erros.push({l:ln,msg:'"'+vend+'" não está na equipe de '+(L().nome||'')}); return; }

    if(IMP.tipo==='vendas'){
      const iTot=idx(['total','valor','venda']), iPag=idx(['pagamento','formadepagamento','forma']);
      const total=num(pega(iTot));
      if(!total){ IMP.erros.push({l:ln,msg:'total inválido'}); return; }
      let pg=pega(iPag).toUpperCase();
      if(PAG.indexOf(pg)<0){ const ach=PAG.find(x=>chave(x)===chave(pg)); pg=ach||'OUTROS'; }
      let cn=pega(idx(['canal'])).toUpperCase(); if(CAN.indexOf(cn)<0) cn='LOJA';
      IMP.linhas.push({data, vendedora:vend, boleta:pega(idx(['boleta','ticket','cupom'])),
        pagamento:pg, total, sapatos:+pega(idx(['sapatos','sapato','s']))||0,
        bolsas:+pega(idx(['bolsas','bolsa','b']))||0,
        acessorios:+pega(idx(['acessorios','acessorio','acessórios','a']))||0,
        canal:cn, obs:pega(idx(['obs','observacao','observação']))});
    }
    else if(IMP.tipo==='escala'){
      const t=TURNO_TXT[chave(pega(idx(['turno','escala']))).toUpperCase()]
           || TURNO_TXT[pega(idx(['turno','escala'])).toUpperCase()];
      if(!t){ IMP.erros.push({l:ln,msg:'turno não reconhecido'}); return; }
      IMP.linhas.push({data, vendedora:vend, turno:t});
    }
    else if(IMP.tipo==='atendimentos'){
      const q=parseInt(pega(idx(['quantidade','qtd','atendimentos','atendimento'])),10);
      if(!(q>=0)){ IMP.erros.push({l:ln,msg:'quantidade inválida'}); return; }
      IMP.linhas.push({data, vendedora:vend, qtd:q});
    }
  });
  IMP.lido=true;
}
async function gravarImport(){
  const L2=IMP.linhas;
  if(!L2.length){ toast('Nada para importar'); return; }
  const lote=(a,n)=>{ const o=[]; for(let i=0;i<a.length;i+=n) o.push(a.slice(i,i+n)); return o; };
  let feitos=0;
  try{
    if(IMP.tipo==='vendas'){
      for(const parte of lote(L2,300)){
        const r=await sb.from('vendas').insert(parte.map(x=>({loja_id:loja, data:x.data,
          vendedora:x.vendedora, boleta:x.boleta||null, pagamento:x.pagamento, total:x.total,
          sapatos:x.sapatos, bolsas:x.bolsas, acessorios:x.acessorios, canal:x.canal,
          obs:x.obs||null, origem:'importado'})));
        if(r.error) throw r.error; feitos+=parte.length;
      }
    }
    else if(IMP.tipo==='escala'){
      for(const parte of lote(L2,400)){
        const r=await sb.from('escala').upsert(parte.map(x=>({loja_id:loja,data:x.data,
          vendedora:x.vendedora,turno:x.turno})),{onConflict:'loja_id,data,vendedora'});
        if(r.error) throw r.error; feitos+=parte.length;
      }
    }
    else if(IMP.tipo==='atendimentos'){
      for(const parte of lote(L2,400)){
        const r=await sb.from('atend_manual').upsert(parte.map(x=>({loja_id:loja,data:x.data,
          vendedora:x.vendedora,qtd:x.qtd})),{onConflict:'loja_id,data,vendedora'});
        if(r.error) throw r.error; feitos+=parte.length;
      }
    }
    else if(IMP.tipo==='bonus'){
      const rg=regras();
      if(!B.carregado) await carregarBonus();
      for(const x of L2){
        let cli=B.clientes.find(c=>c.loja_id===loja && ((x.tel && c.telefone===x.tel) || (!x.tel && c.nome===x.nome)));
        if(!cli){
          const ins=await sb.from('clientes').insert({loja_id:loja,nome:x.nome,telefone:x.tel||null}).select().single();
          if(ins.error) throw ins.error;
          cli=ins.data; B.clientes.push(cli);
        }
        const lib=maisDias(x.data, rg.libera);
        const r=await sb.from('bonus').insert({loja_id:loja, cliente_id:cli.id, data:x.data,
          boleta:x.ticket||null, valor_venda:x.valor,
          valor_bonus:x.bonus || +(x.valor*rg.pct/100).toFixed(2),
          libera_em:lib, vence_em:maisDias(lib, rg.validade)});
        if(r.error) throw r.error; feitos++;
      }
      await carregarBonus();
    }
  }catch(e){
    erro(e);
    toast(feitos?feitos+' linhas entraram antes do erro':'Nada foi importado');
    return;
  }
  IMP.texto=''; IMP.linhas=[]; IMP.erros=[]; IMP.lido=false;
  mesCarregado=''; await carregarMes(); await carregarDia();
  toast(feitos+' linha'+(feitos===1?'':'s')+' importada'+(feitos===1?'':'s'));
  render();
}

// Cada formato de ação busca só a fatia que precisa
async function carregarSegmento(){
  const alvo = varias() ? lojas.map(x=>x.id) : [eu.loja_id];
  const h=hoje(), d=+AC.dias||0;
  const montar=()=>{
    let q=sb.from('bonus').select('*').in('loja_id',alvo);
    if(AC.tipo==='vencendo')        q=q.is('resgatado_em',null).gte('vence_em',h).lte('vence_em',maisDias(h,d||7));
    else if(AC.tipo==='disponivel') q=q.is('resgatado_em',null).gte('vence_em',h).lte('libera_em',h);
    else if(AC.tipo==='perdidos')   q=q.is('resgatado_em',null).lt('vence_em',h).gte('vence_em',maisDias(h,-(d||90)));
    else                            q=q.gte('data', maisDias(h,-365));
    return q;
  };
  const r=await tudo(montar);
  if(r.error){ erro(r.error); return false; }
  B.bonus=juntarPorId(r.data||[], B.bonus);
  await carregarClientesDe(r.data||[]);
  AC.lido=true;
  return true;
}
function segmentar(){
  const h=hoje(), r=regras(), dias=+AC.dias||0;
  const meus=B.bonus.filter(b=>b.loja_id===loja);
  const porCli={};
  meus.forEach(b=>{
    const c=porCli[b.cliente_id]||(porCli[b.cliente_id]={compras:0,gasto:0,bonus:0,vence:'',
      ultima:'',resgates:0,qtd:0});
    c.compras++; c.gasto+= +b.valor_venda;
    if(b.data>c.ultima) c.ultima=b.data;
    if(b.resgatado_em) c.resgates++;
  });
  let linhas=[];
  const nova=(id,extra)=>{
    const c=B.clientes.find(x=>x.id===id)||{}; const p=porCli[id]||{};
    return Object.assign({id, nome:c.nome||'—', tel:c.telefone||'',
      compras:p.compras||0, gasto:p.gasto||0, ultima:p.ultima||'', resgates:p.resgates||0}, extra);
  };
  if(AC.tipo==='vencendo'||AC.tipo==='disponivel'){
    const limite = AC.tipo==='vencendo' ? maisDias(h,dias||7) : '9999-12-31';
    const ag={};
    meus.filter(b=>estadoBonus(b)==='ativo' && b.vence_em<=limite).forEach(b=>{
      const a=ag[b.cliente_id]||(ag[b.cliente_id]={v:0,vc:'',n:0});
      a.v+= +b.valor_bonus; a.n++;
      if(!a.vc||b.vence_em<a.vc) a.vc=b.vence_em;
    });
    linhas=Object.keys(ag).map(id=>nova(id,{valor:ag[id].v, vence:ag[id].vc, qtd:ag[id].n}));
    linhas.sort((a,b)=>a.vence<b.vence?-1:(a.vence>b.vence?1:b.valor-a.valor));
  }
  else if(AC.tipo==='perdidos'){
    const desde=maisDias(h,-(dias||90)), ag={};
    meus.filter(b=>!b.resgatado_em && b.vence_em<h && b.vence_em>=desde).forEach(b=>{
      const a=ag[b.cliente_id]||(ag[b.cliente_id]={v:0,vc:'',n:0});
      a.v+= +b.valor_bonus; a.n++;
      if(b.vence_em>a.vc) a.vc=b.vence_em;
    });
    linhas=Object.keys(ag).map(id=>nova(id,{valor:ag[id].v, vence:ag[id].vc, qtd:ag[id].n}));
    linhas.sort((a,b)=>b.valor-a.valor);
  }
  else if(AC.tipo==='nunca'){
    linhas=Object.keys(porCli).filter(id=>porCli[id].resgates===0 && porCli[id].compras>=2)
      .map(id=>nova(id,{valor:meus.filter(b=>b.cliente_id===id).reduce((x,y)=>x+ +y.valor_bonus,0),
        vence:'', qtd:porCli[id].compras}));
    linhas.sort((a,b)=>b.valor-a.valor);
  }
  else if(AC.tipo==='inativas'){
    const corte=maisDias(h,-(dias||60));
    linhas=Object.keys(porCli).filter(id=>porCli[id].ultima && porCli[id].ultima<corte)
      .map(id=>nova(id,{valor:0, vence:'', qtd:porCli[id].compras}));
    linhas.sort((a,b)=>a.ultima<b.ultima?-1:1);
  }
  else if(AC.tipo==='top'){
    linhas=Object.keys(porCli).map(id=>nova(id,{valor:porCli[id].gasto, vence:'', qtd:porCli[id].compras}));
    linhas.sort((a,b)=>b.gasto-a.gasto);
    linhas=linhas.slice(0,30);
  }
  return linhas.filter(x=>x.nome!=='—');
}
function montarMsg(x){
  const r=regras();
  const modelo = AC.msg!=null ? AC.msg : ACOES[AC.tipo].msg;
  return modelo
    .replace(/\{nome\}/g, (x.nome||'').split(' ')[0].charAt(0)+(x.nome||'').split(' ')[0].slice(1).toLowerCase())
    .replace(/\{valor\}/g, brl(x.valor))
    .replace(/\{vence\}/g, x.vence?labelDia(x.vence):'')
    .replace(/\{ultima\}/g, x.ultima?labelDia(x.ultima):'')
    .replace(/\{minimo\}/g, brl((x.valor||0)*r.mult));
}

  ['bonus','Bônus',['loja_id','data','cliente_id','boleta','vendedora','valor_venda','valor_bonus','libera_em','vence_em','resgatado_em','resgate_boleta','resgate_valor']]

async function lerArquivo(){
  const de=ARQ.mes+'-01', ate=fimDoMes(ARQ.mes);
  const alvo = varias() ? lojas.map(x=>x.id) : [eu.loja_id];
  const out={};
  for(const [t,,] of TABELAS_ARQ){
    // fila não tem id: a chave dela é loja + data + vendedora
    const ordem = t==='fila' ? ['loja_id','data','vendedora'] : ['id'];
    const r=await tudo(()=>sb.from(t).select('*')
      .in('loja_id',alvo).gte('data',de).lte('data',ate), ordem);
    if(r.error){ erro(r.error); return false; }
    out[t]=r.data||[];
  }
  // bônus ainda em aberto não podem ir embora junto com o mês
  out.bonus_presos=(out.bonus||[]).filter(b=>!b.resgatado_em && b.vence_em>=hoje());
  out.bonus=(out.bonus||[]).filter(b=>b.resgatado_em || b.vence_em<hoje());
  // clientes só para dar nome aos bônus arquivados
  const ids=[...new Set((out.bonus||[]).map(b=>b.cliente_id))].filter(Boolean);
  out.clientes=[];
  for(let i=0;i<ids.length;i+=200){
    const r=await sb.from('clientes').select('*').in('id',ids.slice(i,i+200));
    if(!r.error) out.clientes=out.clientes.concat(r.data||[]);
  }
  ARQ.dados=out; ARQ.lido=true; ARQ.baixado=false;
  return true;
}
function baixarArquivo(){
  const n=x=>String(x==null?'':x).replace('.',',');
  const nomeCl=id=>(ARQ.dados.clientes.find(c=>c.id===id)||{}).nome||'';
  const telCl=id=>(ARQ.dados.clientes.find(c=>c.id===id)||{}).telefone||'';
  let baixados=0;
  TABELAS_ARQ.forEach(([t,rot,cols])=>{
    const linhas=ARQ.dados[t]||[];
    if(!linhas.length) return;
    const cab=cols.slice();
    if(t==='bonus'){ cab.splice(2,1,'cliente','telefone'); }
    const L=[cab];
    linhas.slice().sort((a,b)=>a.data<b.data?-1:1).forEach(x=>{
      L.push(cols.map(c=>{
        if(t==='bonus'&&c==='cliente_id') return nomeCl(x[c]);
        const v=x[c];
        return (typeof v==='number')?n(v):(v==null?'':String(v));
      }).reduce((acc,v,i)=>{
        if(t==='bonus'&&cols[i]==='cliente_id'){ acc.push(v, telCl(x.cliente_id)); }
        else acc.push(v);
        return acc;
      },[]));
    });
    baixar('anacapri-'+ARQ.mes+'-'+t+'.csv', csv(L));
    baixados++;
  });
  ARQ.baixado=true;
  toast(baixados+' arquivo'+(baixados===1?'':'s')+' baixado'+(baixados===1?'':'s'));
  render();
}
async function apagarArquivo(){
  const de=ARQ.mes+'-01', ate=fimDoMes(ARQ.mes);
  const alvo = varias() ? lojas.map(x=>x.id) : [eu.loja_id];
  let total=0;
  try{
    // os bônus em aberto ficam; os encerrados vão embora
    const presos=(ARQ.dados.bonus_presos||[]).map(b=>b.id);
    const ir=(ARQ.dados.bonus||[]).map(b=>b.id);
    for(let i=0;i<ir.length;i+=200){
      const r=await sb.from('bonus').delete().in('id',ir.slice(i,i+200));
      if(r.error) throw r.error;
    }
    total+=ir.length;
    // o dia precisa ser reaberto para o gatilho deixar apagar
    const rd=await sb.from('dias').update({fechado:false}).in('loja_id',alvo).gte('data',de).lte('data',ate);
    if(rd.error) throw rd.error;
    for(const t of ['vendas','atendimentos','atend_manual','caixa_mov','despesas','escala','reaberturas','fila','dias']){
      const r=await sb.from(t).delete().in('loja_id',alvo).gte('data',de).lte('data',ate);
      if(r.error) throw r.error;
      total+=(ARQ.dados[t]||[]).length;
    }
    if(presos.length) toast(presos.length+' bônus ainda válidos foram mantidos');
  }catch(e){ erro(e); return; }
  ARQ={mes:ARQ.mes, lido:false, dados:null, baixado:false};
  mesCarregado=''; B.carregado=false; B.bonus=[]; B.clientes=[];
  await carregarMes(true); await carregarDia();
  toast('Mês de '+labelMes(ARQ.mes||mesPainel)+' arquivado — '+total+' registros removidos');
  render();
}

      <table><thead><tr><th>Nome</th><th class="r">Atend.</th><th class="r">Vendeu</th><th class="r">Perdeu</th>
        <th class="r">Taxa de perda</th><th>Motivo mais comum</th></tr></thead>
      <tbody>${nomes.map(n=>{
        const meus=ats.filter(a=>a.vendedora===n);
        if(!meus.length) return '';
        const p=meus.filter(a=>a.vendeu===false);
        const mm={}; p.forEach(a=>{const k=a.motivo||'—';mm[k]=(mm[k]||0)+1;});
        const top=Object.keys(mm).sort((a,b)=>mm[b]-mm[a])[0]||'—';
        const tx=p.length/meus.length*100;
        return `<tr><td>${esc(n)}</td><td class="r num">${meus.length}</td>
          <td class="r num">${meus.length-p.length}</td><td class="r num">${p.length}</td>
          <td class="r num ${tx>taxa+10?'dn':(tx<taxa-10?'up':'')}">${dec(tx,0)}%</td>
          <td style="color:var(--muted);font-size:12.5px">${esc(top)}</td></tr>`;}).join('')}
      </tbody></table>
      <div class="pad" style="border-top:1px solid var(--line2)"><p class="note" style="margin:0">
        Vermelho é quem está 10 pontos acima da média da loja; verde, 10 abaixo.</p></div></div>
  </div><div>
    <div class="card" style="margin-bottom:14px"><h3>Por faixa de horário</h3>
      <table><thead><tr><th>Hora</th><th style="width:70px"></th><th class="r">Atend.</th><th class="r">Conv.</th></tr></thead>
      <tbody>${hs.map(h=>{
        const cv=hora[h].v/hora[h].t*100;
        return `<tr><td class="num">${String(h).padStart(2,'0')}h</td>
          <td><div class="bar"><i style="width:${hora[h].t/maxH*100}%"></i></div></td>
          <td class="r num">${hora[h].t}</td>
          <td class="r num ${cv<40?'dn':''}">${dec(cv,0)}%</td></tr>`;}).join('')}
      </tbody></table>
      <div class="pad" style="border-top:1px solid var(--line2)"><p class="note" style="margin:0">
        Muito movimento com conversão baixa costuma ser falta de gente no salão naquele horário.</p></div></div>

    <div class="card"><h3>Onde atacar primeiro</h3><div class="pad">
      ${(()=>{
        const dicas=[];
        const rup=motOrd.filter(m=>/FALT|RESERVA/.test(m)).reduce((a,m)=>a+porM[m],0);
        if(rup) dicas.push(`<b>${dec(rup/perd.length*100,0)}% das perdas são falta de produto.</b> São ${rup} clientes que queriam comprar e a loja não tinha. A lista de SKUs ao lado é o pedido.`);
        const preco=motOrd.filter(m=>/CARO|PREÇO/.test(m)).reduce((a,m)=>a+porM[m],0);
        if(preco) dicas.push(`<b>${dec(preco/perd.length*100,0)}% saíram por preço.</b> Vale testar argumentação de parcelamento antes de mexer em desconto.`);
        const pensar=motOrd.filter(m=>/PENSAR|VOLTA/.test(m)).reduce((a,m)=>a+porM[m],0);
        if(pensar) dicas.push(`<b>${pensar} clientes disseram que voltam depois.</b> É a fila natural para follow-up no WhatsApp.`);
        const pior=hs.filter(h=>hora[h].t>=5).sort((a,b)=>(hora[a].v/hora[a].t)-(hora[b].v/hora[b].t))[0];
        if(pior!==undefined) dicas.push(`O horário mais fraco é <b>${String(pior).padStart(2,'0')}h</b>, com ${dec(hora[pior].v/hora[pior].t*100,0)}% de conversão em ${hora[pior].t} atendimentos.`);
        return dicas.length?dicas.map(d=>`<p style="margin:0 0 11px;color:var(--muted)">${d}</p>`).join(''):
          '<p style="margin:0;color:var(--muted)">Ainda faltam dados para apontar um foco.</p>';
      })()}
    </div></div>
  </div></div>`;
};

/* ===================== tela: relatório por período ===================== */
telas.relatorio = () => {
  const alvo = varias()?lojas:lojas.filter(x=>x.id===eu.loja_id);
  const cab = `
  <div class="head"><div><h1>Relatório por período</h1>
    <p>Escolha as datas. Vale para qualquer intervalo, inclusive atravessando meses.</p></div></div>
  <div class="card" style="margin-bottom:14px"><div class="pad">
    <div class="entry" style="grid-template-columns:150px 150px 1fr auto auto">
      <div class="fld"><label>De</label><input type="date" id="rp_de" value="${R.de}"></div>
      <div class="fld"><label>Até</label><input type="date" id="rp_ate" value="${R.ate}"></div>
      <div class="fld"><label>Atalhos</label><div class="seg" style="width:100%">
        <button data-rp="30">30 dias</button><button data-rp="90">90 dias</button><button data-rp="ano">12 meses</button></div></div>
      <button class="btn" id="rp_go">Gerar</button>
      ${R.carregado?'<button class="btn gh" id="rp_menu">Exportar ▾</button>':''}
    </div>
  </div></div>`;

  const exportador = !R.carregado ? '' : `
  <div class="card" style="margin-bottom:14px"><h3>Exportar para Excel</h3><div class="pad">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn gh sm" data-exp="vendas">Vendas linha a linha</button>
      <button class="btn gh sm" data-exp="diario">Resumo por dia</button>
      <button class="btn gh sm" data-exp="vendedora">Desempenho por vendedora</button>
      <button class="btn gh sm" data-exp="sku">SKUs perdidos</button>
      <button class="btn gh sm" data-exp="atendimentos">Atendimentos e motivos</button>
      <button class="btn gh sm" data-exp="caixa">Sangrias e suprimentos</button>
      <button class="btn gh sm" data-exp="despesas">Despesas</button>
      <button class="btn gh sm" data-exp="escala">Escala e presença</button>
      <button class="btn gh sm" data-exp="escala_dia">Escala dia a dia</button>
      <button class="btn gh sm" data-exp="reaberturas">Reaberturas de dia</button>
    </div>
    <p class="note">Arquivos .csv separados por ponto e vírgula, abrem direto no Excel em português.</p>
  </div></div>`;

  if(!R.carregado) return cab + `<div class="card"><div class="empty">
    <b>Escolha o período e clique em Gerar</b>Os atalhos preenchem as datas para você.</div></div>`;

  const kT=apura(R.vendas);
  const nDias=Math.round((new Date(R.ate)-new Date(R.de))/86400000)+1;
  const diasComVenda=Object.keys(R.vendas.reduce((o,v)=>{o[v.data]=1;return o;},{})).length;
  const atTot=alvo.reduce((a,lo)=>a+nomesDe(lo.id,R.vendas,R.at).reduce((x,n)=>
    x+atendPeriodo(n,R.at.filter(z=>z.loja_id===lo.id),R.am.filter(z=>z.loja_id===lo.id)),0),0);
  const convT=atTot?kT.tickets/atTot*100:0;
  const sanT=R.mov.filter(m=>m.tipo==='sangria').reduce((a,b)=>a+ +b.valor,0);
  const despT=R.desp.reduce((a,b)=>a+ +b.valor,0);

  const cartao=(t,v,sub)=>`<div class="kpi"><div class="k">${t}</div><div class="v num">${v}</div>
    <div class="pct">${sub||''}</div></div>`;

  const porLoja = alvo.map(lo=>{
    const vd=R.vendas.filter(v=>v.loja_id===lo.id);
    if(!vd.length) return '';
    const ats=R.at.filter(a=>a.loja_id===lo.id), ams=R.am.filter(a=>a.loja_id===lo.id);
    const k=apura(vd);
    const linhas=nomesDe(lo.id,vd,ats).map(n=>{
      const kv=apura(vd.filter(x=>x.vendedora===n));
      const av=atendPeriodo(n,ats,ams);
      const dias=Object.keys(vd.reduce((o,v)=>{o[v.data]=1;return o;},{}));
      const sem=dias.filter(dt=>!vd.some(x=>x.data===dt&&x.vendedora===n)).length;
      return {n,av,sem,...kv};
    }).filter(x=>x.venda||x.av).sort((a,b)=>b.venda-a.venda);
    return `<div class="card" style="margin-bottom:14px"><h3>${esc(lo.nome)} — R$ ${brl0(k.venda)}</h3>
      <table><thead><tr><th>Vendedora</th><th class="r">Venda</th><th class="r">Part.</th><th class="r">Tickets</th>
        <th class="r">V/A</th><th class="r">P/A</th><th class="r">B/S</th><th class="r">Atend.</th>
        <th class="r">Conv.</th><th class="r">Dias s/ venda</th></tr></thead>
      <tbody>${linhas.map(x=>`<tr><td>${esc(x.n)}</td><td class="r num">${brl0(x.venda)}</td>
        <td class="r num" style="color:var(--muted)">${dec(x.venda/k.venda*100,0)}%</td>
        <td class="r num">${x.tickets}</td><td class="r num">${dec(x.va)}</td><td class="r num">${dec(x.pa)}</td>
        <td class="r num">${dec(x.bs,1)}%</td><td class="r num">${x.av||'—'}</td>
        <td class="r num">${x.av?dec(x.tickets/x.av*100,0)+'%':'—'}</td>
        <td class="r num ${x.sem>=5?'dn':''}">${x.sem}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td class="r num">${brl0(k.venda)}</td><td></td>
          <td class="r num">${k.tickets}</td><td class="r num">${dec(k.va)}</td><td class="r num">${dec(k.pa)}</td>
          <td class="r num">${dec(k.bs,1)}%</td><td colspan="3"></td></tr></tbody></table></div>`;
  }).join('');

  const mes={};
  R.vendas.forEach(v=>{ const m=v.data.slice(0,7); mes[m]=(mes[m]||0)+ +v.total; });
  const mx=Math.max(1,...Object.values(mes));

  const perdas=R.at.filter(a=>a.vendeu===false), porM={};
  perdas.forEach(a=>{const m=a.motivo||'—';porM[m]=(porM[m]||0)+1;});
  const sku={};
  R.at.filter(a=>a.sku).forEach(a=>{ sku[a.sku]=sku[a.sku]||{q:0,v:0}; sku[a.sku].q++; sku[a.sku].v+= +a.valor||0; });

  return cab + exportador + `
  <div class="kpis" style="margin-bottom:14px">
    ${cartao('Faturamento','R$ '+brl0(kT.venda), `${diasComVenda} de ${nDias} dias com venda`)}
    ${cartao('Tickets', kT.tickets, 'V/A R$ '+dec(kT.va))}
    ${cartao('Peças', kT.pecas, 'P/A '+dec(kT.pa))}
    ${cartao('Conversão', atTot?dec(convT,1)+'%':'—', atTot?atTot+' atendimentos':'sem contagem no período')}
    ${cartao('Média por dia','R$ '+brl0(diasComVenda?kT.venda/diasComVenda:0), 'sobre dias com venda')}
    ${cartao('Sangrias','R$ '+brl0(sanT), R.mov.filter(m=>m.tipo==='sangria').length+' retiradas')}
  </div>
  ${porLoja}
  <div class="grid2">
    <div>
      <div class="card" style="margin-bottom:14px"><h3>Evolução mensal</h3><div class="pad">
        <div class="chart">${Object.keys(mes).sort().map(m=>`<div style="height:${Math.max(3,mes[m]/mx*100)}%" title="${labelMes(m)} — R$ ${brl(mes[m])}"></div>`).join('')}</div>
        <div class="xlab">${Object.keys(mes).sort().map(m=>`<span>${labelMes(m)}</span>`).join('')}</div>
        <table style="margin-top:12px"><tbody>${Object.keys(mes).sort().map(m=>
          `<tr><td>${labelMes(m)}</td><td class="r num">${brl0(mes[m])}</td></tr>`).join('')}</tbody></table>
      </div></div>
      ${Object.keys(sku).length?`<div class="card"><h3>Demanda reprimida</h3>
        <table><thead><tr><th>SKU procurado</th><th class="r">Vezes</th><th class="r">Valor perdido</th></tr></thead>
        <tbody>${Object.keys(sku).sort((a,b)=>sku[b].q-sku[a].q).slice(0,15).map(k=>
          `<tr><td class="num">${esc(k)}</td><td class="r num">${sku[k].q}</td><td class="r num">${brl(sku[k].v)}</td></tr>`).join('')}
        </tbody></table></div>`:''}
    </div>
    <div>
      <div class="card" style="margin-bottom:14px"><h3>Formas de pagamento</h3><table><tbody>
        ${PAG.filter(x=>kT.porPag[x]).sort((a,b)=>kT.porPag[b]-kT.porPag[a]).map(x=>
          `<tr><td>${x}</td><td class="r num">${brl0(kT.porPag[x])} <span class="tag">${dec(kT.porPag[x]/kT.venda*100,0)}%</span></td></tr>`).join('')}
      </tbody></table></div>
      <div class="card" style="margin-bottom:14px"><h3>Canais e peças</h3><table><tbody>
        ${CAN.filter(c=>kT.porCanal[c]).map(c=>`<tr><td>${c}</td><td class="r num">${brl0(kT.porCanal[c])} <span class="tag">${dec(kT.porCanal[c]/kT.venda*100,0)}%</span></td></tr>`).join('')}
        <tr><td style="color:var(--muted)">Sapatos</td><td class="r num">${kT.s}</td></tr>
        <tr><td style="color:var(--muted)">Bolsas</td><td class="r num">${kT.b}</td></tr>
        <tr><td style="color:var(--muted)">Acessórios</td><td class="r num">${kT.a}</td></tr>
      </tbody></table></div>
      ${perdas.length?`<div class="card" style="margin-bottom:14px"><h3>Por que não vendeu</h3><table><tbody>
        ${Object.keys(porM).sort((a,b)=>porM[b]-porM[a]).map(m=>
          `<tr><td>${esc(m)}</td><td class="r num">${porM[m]} <span class="tag">${dec(porM[m]/perdas.length*100,0)}%</span></td></tr>`).join('')}
      </tbody></table></div>`:''}
      ${(()=>{
        if(!R.esc.length) return `<div class="card" style="margin-bottom:14px"><h3>Escala e presença</h3>
          <div class="empty"><b>Sem escala lançada no período</b>Preencha a grade na aba Escala.</div></div>`;
        const lin=[];
        (varias()?lojas:lojas.filter(x=>x.id===eu.loja_id)).forEach(lo=>{
          nomesDe(lo.id,R.vendas,R.at).forEach(nm=>{
            const p=presenca(lo.id,nm,R.vendas,R.at,R.am,R.esc);
            if(!p.temEscala && !p.diasAtivos) return;
            const kv=apura(R.vendas.filter(v=>v.loja_id===lo.id&&v.vendedora===nm));
            lin.push({loja:lo.nome,nome:nm,venda:kv.venda,...p});
          });
        });
        lin.sort((a,b)=>(b.escalados?b.venda/b.escalados:0)-(a.escalados?a.venda/a.escalados:0));
        return `<div class="card" style="margin-bottom:14px"><h3>Escala e presença</h3>
          <table><thead><tr><th>Vendedora</th><th class="r">Escalados</th><th class="r">Trabalhou</th>
            <th class="r">Sem movimento</th><th class="r">Fora da escala</th><th class="r">R$/dia escalado</th></tr></thead>
          <tbody>${lin.map(x=>`<tr>
            <td>${esc(x.nome)}<div style="font-size:11px;color:var(--faint)">${esc(x.loja)}</div></td>
            <td class="r num">${x.escalados}</td>
            <td class="r num">${x.trabalhou}</td>
            <td class="r num ${x.faltou?'dn':''}">${x.faltou||''}</td>
            <td class="r num ${x.fora?'up':''}">${x.fora||''}</td>
            <td class="r num">${x.escalados?brl0(x.venda/x.escalados):'—'}</td></tr>`).join('')}
          </tbody></table>
          <div class="pad" style="border-top:1px solid var(--line2)"><p class="note" style="margin:0">
            "Sem movimento" é dia escalado em que a pessoa não vendeu nem atendeu ninguém — pode ser falta,
            mas também pode ser dia fraco ou esquecimento de lançar. "Fora da escala" é o contrário:
            houve movimento em dia de folga ou não escalado.</p></div></div>`;
      })()}
      ${R.reab.length?`<div class="card" style="margin-bottom:14px"><h3>Reaberturas de dia</h3>
        <table><thead><tr><th>Loja</th><th>Dia</th><th>Quem</th><th>Motivo</th></tr></thead>
        <tbody>${R.reab.slice().sort((a,b)=>a.criado_em<b.criado_em?1:-1).map(x=>
          `<tr><td><span class="tag">${esc(x.loja_id)}</span></td>
            <td class="num">${labelDia(x.data)}</td><td>${esc(x.quem)}</td>
            <td style="color:var(--muted);font-size:12.5px">${esc(x.motivo)}
              <div style="font-size:11px;color:var(--faint)">reaberto em ${labelDia(x.criado_em.slice(0,10))} às ${hhmm(x.criado_em)}</div></td></tr>`).join('')}
        </tbody></table>
        <div class="pad" style="border-top:1px solid var(--line2)"><p class="note" style="margin:0">
          Todo dia fechado que voltou a ser editado aparece aqui, com quem pediu e por quê.</p></div></div>`:''}
      ${R.desp.length?`<div class="card"><h3>Despesas do período</h3><table><tbody>
        ${(()=>{const u={};R.desp.forEach(x=>{const k=x.unidade||'—';u[k]=(u[k]||0)+ +x.valor;});
          return Object.keys(u).sort((a,b)=>u[b]-u[a]).map(k=>`<tr><td>${esc(k)}</td><td class="r num">${brl(u[k])}</td></tr>`).join('')
            +`<tr class="tot"><td>Total</td><td class="r num">${brl(despT)}</td></tr>`;})()}
      </tbody></table></div>`:''}
    </div>
  </div>`;
};

/* ===================== tela: equipe ===================== */
telas.equipe = () => {
  const alvo = varias()?lojas:lojas.filter(x=>x.id===eu.loja_id);
  const linhas=[];
  alvo.forEach(lo=>{
    const vd=M.vendas.filter(v=>v.loja_id===lo.id), at=M.at.filter(a=>a.loja_id===lo.id&&a.fim);
    const ams=M.am.filter(a=>a.loja_id===lo.id);
    const dias=Object.keys(vd.reduce((o,v)=>{o[v.data]=1;return o;},{}));
    nomesDe(lo.id,vd,at).forEach(nm=>{
      const kv=apura(vd.filter(x=>x.vendedora===nm));
      const av=atendPeriodo(nm,at,ams);
      if(!kv.venda&&!av) return;
      const o={loja:lo.nome,nome:nm,meta:metaDe(lo.id,nm),av,
        sem:dias.filter(dt=>!vd.some(x=>x.data===dt&&x.vendedora===nm)).length};
      linhas.push(Object.assign(o,kv));
    });
  });
  linhas.sort((a,b)=>b.venda-a.venda);
  const top=linhas.length?linhas[0].venda||1:1;
  return `
  <div class="head"><div><h1>Equipe</h1><p>Ranking de ${labelMes(mesPainel)}.</p></div>
    <div class="spacer"></div>${selMes()}</div>
  <div class="card">${linhas.some(x=>x.venda)?`<table>
    <thead><tr><th>#</th><th>Vendedora</th><th>Loja</th><th class="r">Venda</th><th></th><th class="r">% meta</th>
    <th class="r">Tickets</th><th class="r">V/A</th><th class="r">P/A</th><th class="r">B/S</th><th class="r">Conv.</th><th class="r">Dias s/ venda</th></tr></thead>
    <tbody>${linhas.map((x,i)=>{const pm=x.meta?x.venda/x.meta*100:0, cv=x.av?x.tickets/x.av*100:0;
      return `<tr><td class="num" style="color:var(--faint)">${i+1}</td><td><b>${esc(x.nome)}</b></td>
      <td><span class="tag">${esc(x.loja)}</span></td><td class="r num">${brl0(x.venda)}</td>
      <td style="width:90px"><div class="bar"><i class="${pm>=100?'ok':''}" style="width:${x.venda/top*100}%"></i></div></td>
      <td class="r num ${pm>=100?'up':''}">${x.meta?dec(pm,0)+'%':'—'}</td><td class="r num">${x.tickets}</td>
      <td class="r num">${dec(x.va)}</td><td class="r num">${dec(x.pa)}</td><td class="r num">${dec(x.bs,1)}%</td>
      <td class="r num">${x.av?dec(cv,0)+'%':'—'}</td><td class="r num ${x.sem>=5?'dn':''}">${x.sem}</td></tr>`;}).join('')}
    </tbody></table>`:`<div class="empty"><b>Sem vendas em ${labelMes(mesPainel)}</b>O ranking aparece com os primeiros lançamentos.</div>`}</div>`;
};

/* ===================== tela: meu painel ===================== */
telas.meu = () => {
  const me=pessoas.find(p=>p.nome===eu.nome)||{meta:0};
  const vd=M.vendas.filter(v=>v.vendedora===eu.nome), k=apura(vd);
  const at=M.at.filter(a=>a.vendedora===eu.nome&&a.fim);
  const totAt=atendPeriodo(eu.nome, M.at.filter(a=>a.loja_id===loja), M.am.filter(a=>a.loja_id===loja));
  const conv=totAt?k.tickets/totAt*100:0, Lo=L();
  const perdas=at.filter(a=>a.vendeu===false), porM={};
  perdas.forEach(p=>{const m=p.motivo||'—';porM[m]=(porM[m]||0)+1;});
  const kpi=(n,v,m,f,s)=>{const p=m?v/m*100:0;
    return `<div class="kpi"><div class="k">${n}</div><div class="v num">${f}${s||''}</div>
      <div class="bar"><i class="${p>=100?'ok':''}" style="width:${Math.min(100,p)}%"></i></div>
      <div class="pct">${m?`<b>${dec(p,0)}%</b> da meta`:'sem meta'}</div></div>`;};
  return `
  <div class="head"><div><h1>Meu painel</h1><p>${esc(eu.nome)} · ${labelMes(mesPainel)}</p></div>
    <div class="spacer"></div>${selMes()}</div>
  <div class="kpis" style="margin-bottom:14px">
    ${kpi('Minha venda',k.venda,me.meta,'R$ '+brl0(k.venda))}
    ${kpi('V/A',k.va,Lo.mva,'R$ '+dec(k.va))}
    ${kpi('P/A',k.pa,Lo.mpa,dec(k.pa))}
    ${kpi('Conversão',conv,Lo.mcv,dec(conv,1),'%')}
  </div>
  <div class="grid2"><div class="card"><h3>Meus atendimentos</h3>

/* ===================== tela: despesas ===================== */
telas.despesas = () => {

  const porG={}, porU={};
  M.desp.forEach(x=>{
    const c=cats.find(y=>y.id===x.categoria_id);
    const g=c?c.grupo_dre:'NÃO CLASSIFICADO';
    porG[g]=(porG[g]||0)+ +x.valor;
    const u=x.unidade||'—'; porU[u]=(porU[u]||0)+ +x.valor;
  });
  const nomeCat=id=>{const c=cats.find(y=>y.id===id);return c?c.nome:'';};
  const grupoCat=id=>{const c=cats.find(y=>y.id===id);return c?c.grupo_dre:'';};

        <div class="fld"><label>Categoria</label>
          <select id="dp_cat">
            <option value="">— escolher —</option>
            ${grupos.map(g=>`<optgroup label="${esc(g)}">${ativas.filter(c=>c.grupo_dre===g)

/* ===================== eventos ===================== */
document.addEventListener('click', async e=>{
  const t=e.target;
  const nb=t.closest('.navb'); if(nb) return nav(nb.dataset.nav);
  if(t.id==='sair'||t.id==='sair2'){ await sb.auth.signOut(); location.reload(); return; }
  if(t.id==='reler'){ await carregarMes(true); render(); toast('Painel atualizado'); return; }
  if(t.dataset.sub){
    subP=t.dataset.sub;
    if(subP==='relatorio'&&!R.de){ R.ate=hoje(); R.de=hoje().slice(0,8)+'01'; }
    render(); return;
  }
  if(t.dataset.loja){ loja=t.dataset.loja; mesCarregado=''; await carregarDia(); await carregarMes(); render(); return; }

  if(t.dataset.ini)   return iniciarAt(t.dataset.ini);
  if(t.dataset.pau)   return modalPausa(t.dataset.pau);
  if(t.dataset.volta) return mudarFila(t.dataset.volta,'disp');
  if(t.dataset.livre) return liberar(t.dataset.livre);
  if(t.dataset.fim)   return modalFim(t.dataset.fim);
  if(t.dataset.x)     return fechar();
  if(t.dataset.pz){ const n=ctx.nome; fechar(); return mudarFila(n,'indisp',t.dataset.pz); }
  if(t.dataset.v!==undefined){ ctx.vendeu=t.dataset.v==='1'; detFim(); return; }
  if(t.id==='m_mais'){ const x=document.getElementById('m_extra');
    const ab=x.style.display==='none';
    x.style.display=ab?'grid':'none'; t.textContent=ab?'menos detalhes':'mais detalhes'; return; }

  if(t.id==='okfim'){
    const g=id=>document.getElementById(id);
    const dados={vendeu:ctx.vendeu}; let venda=null;
    if(ctx.vendeu){
      const total=num(g('m_tot').value);
      if(!total){ toast('Informe o total da venda'); g('m_tot').focus(); return; }
      const boleta=(g('m_bol').value||'').trim(), obs=(g('m_obs').value||'').trim();
      const cn=g('m_can').value, s=+g('m_s').value||0, b=+g('m_b').value||0, a=+g('m_a').value||0;
      let v2=0, pag2='';
      const dv=g('m_div');
      if(dv&&dv.checked){
        v2=num(g('m_val2')?g('m_val2').value:0); pag2=g('m_pag2')?g('m_pag2').value:'';
        if(!v2||v2>=total){ toast('O valor da 2ª forma tem que ser menor que o total'); return; }
      }
      venda=[{vendedora:ctx.nome,boleta,pagamento:g('m_pag').value,total:total-v2,
              sapatos:s,bolsas:b,acessorios:a,canal:cn,obs:(v2?'PG 1/2 · ':'')+obs}];
      if(v2) venda.push({vendedora:ctx.nome,boleta,pagamento:pag2,total:v2,
              sapatos:0,bolsas:0,acessorios:0,canal:cn,obs:('PG 2/2 · '+obs).trim()});
      dados.boleta=boleta; dados.valor=total;
      ctx.cli=(g('m_cli')?g('m_cli').value:'').trim();
      ctx.tel=(g('m_tel')?g('m_tel').value:'').trim();
    } else {
      if(!ctx.motivo){ toast('Selecione o motivo'); return; }
      const mt=motivos.find(x=>x.texto===ctx.motivo);
      dados.motivo=ctx.motivo;
      if(mt&&mt.exige_sku){
        dados.sku=(g('m_sku')?g('m_sku').value:'').trim();
        dados.valor=num(g('m_val')?g('m_val').value:0);
        if(!dados.sku){ toast('Informe o SKU procurado'); return; }
      }
    }
    const n=ctx.nome, cli=ctx.cli, tel=ctx.tel, tt=dados.valor, bol=dados.boleta;

  if(t.id==='es_semana'){
    const nD=diasNoMes(mesPainel), ano=+mesPainel.slice(0,4), mm=+mesPainel.slice(5,7);
    const eq=equipe(loja);
    if(!eq.length){ toast('Nenhuma vendedora cadastrada'); return; }
    if(!confirm('Marcar "'+(TURNOS.find(x=>x.k===pincel)||{}).t+'" em todos os dias de segunda a sábado, para toda a equipe? O que já estiver marcado será substituído.')) return;
    const linhas=[];
    for(let d=1;d<=nD;d++){
      if(new Date(ano,mm-1,d).getDay()===0) continue;
      const data=mesPainel+'-'+String(d).padStart(2,'0');
      eq.forEach(v=>linhas.push({loja_id:loja,data,vendedora:v.nome,turno:pincel}));
    }
    t.disabled=true; t.textContent='Salvando…';
    const r=await sb.from('escala').upsert(linhas,{onConflict:'loja_id,data,vendedora'}).select();
    if(r.error){ t.disabled=false; t.textContent='Preencher dias úteis com o turno escolhido'; return erro(r.error); }
    mesCarregado=''; await carregarMes(); render(); toast(linhas.length+' dias marcados');
    return;
  }
  if(t.id==='es_limpa'){
    if(!confirm('Apagar a escala inteira de '+labelMes(mesPainel)+' nesta loja?')) return;
    const r=await sb.from('escala').delete().eq('loja_id',loja)
      .gte('data',mesPainel+'-01').lte('data',fimDoMes(mesPainel));
    if(r.error) return erro(r.error);
    mesCarregado=''; await carregarMes(); render(); toast('Escala apagada'); return;
  }
  if(t.dataset.tm){ tipoMov=t.dataset.tm; render(); return; }
  if(t.id==='cx_add'){
    const g=id=>document.getElementById(id);
    const c=caixaDia(), lim=+L().limite_sangria||0;
    const val=num(g('cx_val').value);
    if(!val){ g('cx_val').focus(); toast('Informe o valor'); return; }
    const quem = opera()? g('cx_quem').value : eu.nome;
    const aut = g('cx_aut')?g('cx_aut').value:'';
    if(tipoMov==='sangria'){
      if(val>c.gaveta+0.005){ toast('Só há R$ '+brl(c.gaveta)+' na gaveta'); return; }
      if(lim&&val>=lim&&!aut){ toast('Sangria de R$ '+brl0(val)+' precisa de autorização'); return; }
    }
    const destino=g('cx_dest').value, obs=g('cx_obs').value.trim();
    const r=await sb.from('caixa_mov').insert({loja_id:loja,data:dia,tipo:tipoMov,valor:val,quem,destino,obs,
      autorizado_por:(tipoMov==='sangria'&&lim&&val>=lim)?aut:null}).select().single();
    if(r.error) return erro(r.error);
    D.mov.push(r.data);
    let extra='';
    if(tipoMov==='sangria'&&destino==='PAGAMENTO DE DESPESA'){
      const rd=await sb.from('despesas').insert({loja_id:loja,data:dia,valor:val,unidade:'ANACAPRI',
        pago_com:'DINHEIRO (SANGRIA)',descricao:obs||'sangria para pagamento',origem_mov:r.data.id});
      if(!rd.error) extra=' e lançada em Despesas';
    }
    toast(tipoMov==='sangria'?'Sangria de R$ '+brl(val)+' registrada'+extra:'Suprimento registrado');
    render(); return;
  }
  if(t.dataset.rmc){
    const r=await sb.from('caixa_mov').delete().eq('id',t.dataset.rmc);
    if(r.error) return erro(r.error);
    D.mov=D.mov.filter(m=>m.id!==t.dataset.rmc); render(); return;
  }

  if(t.id==='dp_add'){
    const g=id=>document.getElementById(id);
    const v=num(g('dp_v').value);
    if(!v){ g('dp_v').focus(); toast('Informe o valor'); return; }
    const r=await sb.from('despesas').insert({loja_id:loja,data:g('dp_dt').value||dia,valor:v,
      unidade:(g('dp_l').value||'ANACAPRI').toUpperCase(),pago_com:g('dp_c').value.toUpperCase(),
      descricao:g('dp_d').value.trim(), categoria_id:g('dp_cat').value||null}).select().single();
    if(r.error) return erro(r.error);
    M.desp.push(r.data); M.desp.sort((a,b)=>a.data<b.data?-1:1); render(); return;
  }
  if(t.dataset.rmd){
    const r=await sb.from('despesas').delete().eq('id',t.dataset.rmd);
    if(r.error) return erro(r.error);
    M.desp=M.desp.filter(x=>x.id!==t.dataset.rmd); render(); return;
  }

  if(t.dataset.addp){
    const r=await sb.from('pessoas').insert({loja_id:t.dataset.addp,nome:'NOVA',papel:'vendedora',meta:0,ordem:99}).select().single();
    if(r.error) return erro(r.error); pessoas.push(r.data); render(); return;
  }
  if(t.dataset.rmp){
    const r=await sb.from('pessoas').delete().eq('id',t.dataset.rmp);
    if(r.error) return erro(r.error); pessoas=pessoas.filter(p=>p.id!==t.dataset.rmp); render(); return;
  }
  if(t.id==='addcat'){
    const r=await sb.from('categorias_despesa').insert({nome:'NOVA CATEGORIA',
      grupo_dre:(cats[0]&&cats[0].grupo_dre)||'OUTRAS',ordem:99,ativa:true}).select().single();
    if(r.error) return erro(r.error); cats.push(r.data); render(); return;
  }
  if(t.dataset.rmc2){
    const usada=M.desp.some(x=>x.categoria_id===t.dataset.rmc2);
    if(usada){ toast('Essa categoria está em uso no mês aberto — desative em vez de apagar'); return; }
    const r=await sb.from('categorias_despesa').delete().eq('id',t.dataset.rmc2);
    if(r.error) return erro(r.error); cats=cats.filter(c=>c.id!==t.dataset.rmc2); render(); return;
  }
  if(t.id==='addm'){
    const r=await sb.from('motivos').insert({texto:'NOVO MOTIVO',exige_sku:false,ordem:99}).select().single();
    if(r.error) return erro(r.error); motivos.push(r.data); render(); return;
  }
  if(t.dataset.rmm){
    const r=await sb.from('motivos').delete().eq('id',t.dataset.rmm);
    if(r.error) return erro(r.error); motivos=motivos.filter(m=>m.id!==t.dataset.rmm); render(); return;
  }
  if(t.id==='addz'){
    const r=await sb.from('pausas').insert({texto:'NOVA PAUSA',ordem:99}).select().single();
    if(r.error) return erro(r.error); pausas.push(r.data); render(); return;
  }
  if(t.dataset.rmz){
    const r=await sb.from('pausas').delete().eq('id',t.dataset.rmz);
    if(r.error) return erro(r.error); pausas=pausas.filter(p=>p.id!==t.dataset.rmz); render(); return;
  }
});

  if(t.id==='m_div'){
    document.getElementById('m_div2').innerHTML = t.checked
      ? `<div class="two"><div class="fld"><label>2ª forma de pagamento</label><select id="m_pag2">${PAG.map(p=>`<option>${p}</option>`).join('')}</select></div>
         <div class="fld"><label>Valor nessa 2ª forma R$</label><input id="m_val2" inputmode="decimal" placeholder="69,70"></div></div>` : '';
    return;
  }
  if(t.id==='m_mot'){ ctx.motivo=t.value; detFim(); return; }

  if(t.id==='mesP'){ mesPainel=t.value; await carregarMes(); render(); return; }
  if(t.dataset.cx){ const o={}; o[t.dataset.cx]=num(t.value); return upsertDia(o); }
  if(t.dataset.am!==undefined){

    if(i>=0) D.am[i]=r.data; else D.am.push(r.data);

  if(t.dataset.setcat!==undefined){
    const r=await sb.from('despesas').update({categoria_id:t.value||null}).eq('id',t.dataset.setcat).select().single();

  }
  if(t.dataset.pn||t.dataset.pm){
    const id=t.dataset.pn||t.dataset.pm, campo=t.dataset.pn?'nome':'meta';
    const val=t.dataset.pn?t.value.toUpperCase().trim():num(t.value), o={}; o[campo]=val;
    const r=await sb.from('pessoas').update(o).eq('id',id);
    if(r.error) return erro(r.error);
    pessoas.find(x=>x.id===id)[campo]=val; if(campo==='nome') render(); return;
  }
  if(t.dataset.cn||t.dataset.cg||t.dataset.ca){
    const id=t.dataset.cn||t.dataset.cg||t.dataset.ca;
    const campo=t.dataset.cn?'nome':(t.dataset.cg?'grupo_dre':'ativa');
    const val=t.dataset.ca?t.checked:t.value.toUpperCase().trim();
    const o={}; o[campo]=val;
    const r=await sb.from('categorias_despesa').update(o).eq('id',id);
    if(r.error) return erro(r.error);
    const c=cats.find(x=>x.id===id); c[campo]=val;
    if(campo!=='nome') render();
    return;
  }
  if(t.dataset.mt||t.dataset.ms){
    const id=t.dataset.mt||t.dataset.ms, campo=t.dataset.mt?'texto':'exige_sku';
    const val=t.dataset.mt?t.value.toUpperCase():t.checked, o={}; o[campo]=val;
    const r=await sb.from('motivos').update(o).eq('id',id);
    if(r.error) return erro(r.error);
    motivos.find(x=>x.id===id)[campo]=val; return;
  }
  if(t.dataset.pz2){
    const r=await sb.from('pausas').update({texto:t.value.toUpperCase()}).eq('id',t.dataset.pz2);

  }
});
