<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Anacapri — Gestão de vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2E2724; --muted:#726A64; --faint:#A39A92;
  --line:#E6DFD7; --line2:#F1ECE6; --bg:#FAF7F3; --surface:#FFFFFF; --sand:#F2E9DE;
  --marca:#8E3B5D; --marca-esc:#73304C; --marca-soft:#F8EDF1;
  --ok:#2A7F62; --ok-soft:#E9F3EF;
  --warn:#9A7018; --warn-soft:#FAF2E0;
  --bad:#B23A31; --bad-soft:#FBEEEC;
  --busy:#3D6BB0; --busy-soft:#ECF1F9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Archivo,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

#app{display:none;min-height:100vh}
#app.on{display:flex}
#rail{width:230px;flex:0 0 230px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:0 8px 18px;border-bottom:1px solid var(--line2);margin-bottom:14px}
.brand b{font-family:Jost,sans-serif;font-weight:400;font-size:20px;letter-spacing:.30em;display:block;text-transform:uppercase;color:var(--marca)}
.brand span{color:var(--faint);font-size:11.5px}
#navs{flex:1}
.navb{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;margin-bottom:2px;background:none;border:0;border-radius:6px;cursor:pointer;text-align:left;color:var(--muted);font-size:14px}
.navb:hover{background:var(--line2);color:var(--ink)}
.navb.on{background:var(--marca);color:#fff;font-weight:500}
.navb i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.4;flex:0 0 6px}
.navb.on i{opacity:1}
main{flex:1;min-width:0;padding:24px 26px 90px}
.head{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-family:Jost,sans-serif;font-weight:400;font-size:27px;margin:0}
.head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.spacer{flex:1}

.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11.5px;color:var(--faint)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 9px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--marca);box-shadow:0 0 0 3px var(--marca-soft)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.btn{background:var(--marca);color:#fff;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--marca-esc);opacity:1}
.btn:disabled{opacity:.4;cursor:default}
.btn.gh{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.gh:hover{background:var(--line2);opacity:1}
.btn.sm{padding:6px 11px;font-size:13px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{background:none;border:0;border-radius:5px;padding:7px 14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--marca);color:#fff}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.card > h3{margin:0;padding:12px 15px;border-bottom:1px solid var(--line2);font-size:13.5px;font-weight:600}
.pad{padding:15px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}

table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--faint);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line2)}
tbody tr:last-child td{border-bottom:0}
.r{text-align:right}
tr.tot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0;background:var(--sand)}
.del{background:none;border:0;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:2px 5px;border-radius:5px}
.del:hover{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:3px;background:var(--line2);color:var(--muted)}
.tag.g{background:var(--ok-soft);color:var(--ok)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.k{background:var(--marca);color:#fff}

.entry{display:grid;grid-template-columns:86px 1fr 1fr 104px 52px 52px 52px 1fr 1.4fr 46px;gap:8px;align-items:end}
.recon{display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:10px;border:1px solid;flex-wrap:wrap}
.recon.ok{background:var(--ok-soft);border-color:#C6DED5;color:var(--ok)}
.recon.off{background:var(--warn-soft);border-color:#E6D9B8;color:var(--warn)}
.recon b{font-size:19px;font-family:Jost,sans-serif;font-weight:500}
.recon .lbl{color:var(--muted);font-size:12.5px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:Jost,sans-serif;font-weight:400;font-size:28px;margin:2px 0 6px}
.bar{height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--marca)}
.bar i.ok{background:var(--ok)}
.pct{font-size:12px;color:var(--muted);margin-top:5px}
.pct b{color:var(--ink)}
.up{color:var(--ok)} .dn{color:var(--bad)}
.chart{display:flex;align-items:flex-end;gap:2px;height:104px;padding:0 2px}
.chart div{flex:1;background:var(--marca);opacity:.30;border-radius:2px 2px 0 0;min-height:2px}
.chart div.hi{opacity:1}
.xlab{display:flex;gap:2px;padding:5px 2px 0}
.xlab span{flex:1;text-align:center;font-size:9.5px;color:var(--faint)}
.empty{padding:34px 15px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:3px}
.note{font-size:12.5px;color:var(--muted);margin-top:9px}

.fila{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col > h3{display:flex;align-items:center;gap:8px}
.col > h3 em{font-style:normal;margin-left:auto;font-weight:600;font-size:12px;color:var(--faint)}
.col.disp > h3{background:var(--ok-soft);color:var(--ok);border-radius:10px 10px 0 0}
.col.atend > h3{background:var(--busy-soft);color:var(--busy);border-radius:10px 10px 0 0}
.col.indisp > h3{background:var(--warn-soft);color:var(--warn);border-radius:10px 10px 0 0}
.pes{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--line2)}
.pes:last-child{border-bottom:0}
.pes.vez{background:var(--marca-soft)}
.av{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;font-weight:500;font-size:13.5px;background:var(--line2);color:var(--muted);font-family:Jost,sans-serif}
.pes.vez .av{background:var(--marca);color:#fff}
.pes .i{flex:1;min-width:0}
.pes .i b{display:block;font-weight:600}
.pes .i span{font-size:11.5px;color:var(--muted)}
.acts{display:flex;gap:5px;flex-wrap:wrap}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;cursor:pointer;font-size:12.5px}
.ib:hover{background:var(--line2)}
.ib.go{background:var(--marca);border-color:var(--marca);color:#fff}
.ib.stop{background:var(--surface);border-color:var(--marca);color:var(--marca);font-weight:500}
.ib.back{background:var(--ok);border-color:var(--ok);color:#fff}

#modal{position:fixed;inset:0;background:rgba(46,39,36,.45);display:none;place-items:center;z-index:60;padding:16px}
#modal.on{display:grid}
.sheet{background:var(--surface);border-radius:12px;width:min(470px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet h4{margin:0;padding:15px 18px;border-bottom:1px solid var(--line2);font-size:15px;font-weight:600}
.sheet .bd{padding:18px;display:grid;gap:13px}
.sheet .ft{padding:0 18px 18px;display:flex;gap:9px}
.sheet .ft .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.chk{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{width:auto}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pick button{padding:17px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:15px}
.pick button.s{background:var(--ok);border-color:var(--ok);color:#fff}
.pick button.n{background:var(--bad);border-color:var(--bad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 13px;cursor:pointer;font-size:12.5px}

#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:22px;z-index:80}
#login.off{display:none}
.lx{width:min(370px,100%);text-align:center}
.lx .wm{font-family:Jost,sans-serif;font-weight:300;font-size:30px;letter-spacing:.34em;text-transform:uppercase;margin-bottom:6px;color:var(--marca)}
.lx .sb{color:var(--muted);margin-bottom:26px;font-size:13px}
.lx .fld{text-align:left;margin-bottom:11px}
.lx .btn{width:100%;padding:11px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:9px 12px;font-size:13px;margin-bottom:12px;text-align:left}
#who{border-top:1px solid var(--line2);padding-top:12px}
#who .trocar{width:100%;background:none;border:1px solid var(--line);border-radius:7px;padding:9px 10px;cursor:pointer;text-align:left}
#who .trocar b{display:block;font-size:13px}
#who .trocar span{font-size:11.5px;color:var(--faint)}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--marca-esc);color:#fff;padding:11px 18px;border-radius:7px;transition:transform .22s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.up{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

#mwho{display:none;align-items:center;gap:8px;margin-bottom:13px}
@media(max-width:900px){
  #app.on{display:block}
  #rail{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;flex-direction:row;gap:4px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:20}
  .brand,#who{display:none}
  #navs{display:flex;gap:4px;width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #navs::-webkit-scrollbar{display:none}
  .navb{flex:0 0 auto;min-width:66px}
  .navb{flex-direction:column;gap:3px;justify-content:center;font-size:10.5px;padding:6px 2px;margin:0;text-align:center;flex:1}
  .navb i{width:5px;height:5px;flex:0 0 5px}
  main{padding:16px 13px 96px}
  .grid2,.fila{grid-template-columns:1fr}
  .entry{grid-template-columns:1fr 1fr;gap:9px}
  .entry .wide{grid-column:1/-1}
  .head h1{font-size:23px}
  #mwho{display:flex}
}
</style>

<div id="login"><div class="lx">
  <div class="wm">Anacapri</div>
  <div class="sb">Gestão de vendas</div>
  <div id="lerr"></div>
  <div class="fld"><label>E-mail</label><input id="lem" type="email" autocomplete="username"></div>
  <div class="fld"><label>Senha</label><input id="lpw" type="password" autocomplete="current-password"></div>
  <button class="btn" id="lgo">Entrar</button>
</div></div>

<div id="app">
  <nav id="rail">
    <div class="brand"><b>Anacapri</b><span>Gestão de vendas</span></div>
    <div id="navs"></div>
    <div id="who"></div>
  </nav>
  <main id="view"></main>
</div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ===================== configuração ===================== */
/* Preencha as duas linhas abaixo, ou deixe como estão e configure pela
   própria tela de entrada — o endereço fica guardado no navegador.      */
let SUPABASE_URL  = 'https://ruicopcszsjmyaeywecj.supabase.co';
let SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ1aWNvcGNzenNqbXlhZXl3ZWNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxOTU1OTIsImV4cCI6MjEwMzc3MTU5Mn0.D4eqocvSQ52-cxVmuwDBMGOWc7tZJRdfAkpN5bePxoA';

let sb=null;
function guardado(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function guardar(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function conectar(){
  if(!window.supabase || !window.supabase.createClient){
    return 'biblioteca';
  }
  const url = /^https:\/\//.test(SUPABASE_URL) ? SUPABASE_URL : guardado('ana_url');
  const key = SUPABASE_ANON.indexOf('COLE_') === 0 ? guardado('ana_key') : SUPABASE_ANON;
  if(!/^https:\/\//.test(url) || !key) return 'configurar';
  try{ sb = window.supabase.createClient(url, key); return 'ok'; }
  catch(e){ console.error(e); return 'erro:'+e.message; }
}

const PAG=['DEBITO','CREDITO AV','CREDITO X','DINHEIRO','PIX','LINK ZZNET','OUTROS'];
const CAN=['LOJA','ONLINE','WHATSAPP'];
const DEST=['COFRE','DEPÓSITO BANCÁRIO','PAGAMENTO DE DESPESA','TROCO PARA OUTRO CAIXA','ENTREGA AO PROPRIETÁRIO','OUTROS'];
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* ===================== estado ===================== */
let eu=null, lojas=[], pessoas=[], motivos=[], pausas=[];
let loja='', dia=hoje(), mesPainel=hoje().slice(0,7), atual='fila';
let D={dia:null,vendas:[],at:[],fila:[],mov:[],am:[],reab:[]};
let M={vendas:[],at:[],mov:[],desp:[],am:[]};
let R={de:'',ate:'',vendas:[],at:[],mov:[],desp:[],am:[],reab:[],carregado:false};
let canal=null, tipoMov='sangria';

/* ===================== utilidades ===================== */
function hoje(){ const d=new Date(); return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function ym(d){ return d.slice(0,7); }
function fimDoMes(m){ const p=m.split('-').map(Number); return m+'-'+String(new Date(p[0],p[1],0).getDate()).padStart(2,'0'); }
function diasNoMes(m){ const p=m.split('-').map(Number); return new Date(p[0],p[1],0).getDate(); }
function labelMes(m){ const p=m.split('-'); return MES[+p[1]-1]+'/'+p[0]; }
function labelDia(d){ const p=d.split('-'); return p[2]+'/'+p[1]; }
function hhmm(t){ if(!t) return '—'; const d=new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function minsDesde(t){ return t?Math.max(0,Math.round((Date.now()-new Date(t))/60000)):0; }
function dur(a,b){ return (a&&b)?Math.max(0,Math.round((new Date(b)-new Date(a))/60000)):0; }
function tempo(m){ return m<60?m+' min':Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'); }
function ini(n){ return (n||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join(''); }
const brl=n=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const brl0=n=>Math.round(+n||0).toLocaleString('pt-BR');
const dec=(n,c=2)=>(isFinite(n)?n:0).toLocaleString('pt-BR',{minimumFractionDigits:c,maximumFractionDigits:c});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/\./g,'').replace(',','.'));return isFinite(n)?n:0;};
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('up');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('up'),2400);}
function erro(e){ console.error(e); toast((e&&e.message)||'Não deu para salvar. Tente de novo.'); }

const L=()=>lojas.find(x=>x.id===loja)||lojas[0]||{};
const gestor=()=>eu&&(eu.papel==='dono'||eu.papel==='gerente');
const opera =()=>eu&&(eu.papel==='dono'||eu.papel==='gerente'||eu.papel==='tablet');
const varias=()=>eu&&!eu.loja_id;   // dono e tablet geral enxergam as duas lojas
const equipe=l=>pessoas.filter(p=>p.loja_id===l&&p.papel==='vendedora'&&p.ativa).sort((a,b)=>a.ordem-b.ordem);
const gerenteDa=l=>(pessoas.find(p=>p.loja_id===l&&p.papel==='gerente')||{}).nome||'a gerência';

/* ===================== carga ===================== */
async function carregarBase(){
  const r = await Promise.all([
    sb.from('lojas').select('*').order('nome'),
    sb.from('pessoas').select('*').order('ordem'),
    sb.from('motivos').select('*').order('ordem'),
    sb.from('pausas').select('*').order('ordem')
  ]);
  if(r[0].error) throw r[0].error;
  lojas=r[0].data||[]; pessoas=r[1].data||[]; motivos=r[2].data||[]; pausas=r[3].data||[];
}
async function carregarDia(){
  const f={loja_id:loja,data:dia};
  const r = await Promise.all([
    sb.from('dias').select('*').match(f).maybeSingle(),
    sb.from('vendas').select('*').match(f).order('criado_em'),
    sb.from('atendimentos').select('*').match(f).order('inicio'),
    sb.from('fila').select('*').eq('loja_id',loja),
    sb.from('caixa_mov').select('*').match(f).order('criado_em'),
    sb.from('atend_manual').select('*').match(f),
    sb.from('reaberturas').select('*').match(f).order('criado_em')
  ]);
  D={dia:r[0].data||null, vendas:r[1].data||[], at:r[2].data||[], fila:r[3].data||[],
     mov:r[4].data||[], am:r[5].data||[], reab:r[6].data||[]};
  await garantirFila();
}
async function carregarMes(){
  const de=mesPainel+'-01', ate=fimDoMes(mesPainel);
  const alvo = varias() ? lojas.map(x=>x.id) : [eu.loja_id];
  const r = await Promise.all([
    sb.from('vendas').select('*').in('loja_id',alvo).gte('data',de).lte('data',ate),
    sb.from('atendimentos').select('*').in('loja_id',alvo).gte('data',de).lte('data',ate),
    sb.from('caixa_mov').select('*').in('loja_id',alvo).gte('data',de).lte('data',ate),
    sb.from('despesas').select('*').in('loja_id',alvo).gte('data',de).lte('data',ate).order('data'),
    sb.from('atend_manual').select('*').in('loja_id',alvo).gte('data',de).lte('data',ate)
  ]);
  M={vendas:r[0].data||[], at:r[1].data||[], mov:r[2].data||[], desp:r[3].data||[], am:r[4].data||[]};
}
async function garantirFila(){
  const falta=equipe(loja).filter(v=>!D.fila.some(f=>f.vendedora===v.nome));
  if(!falta.length) return;
  const linhas=falta.map((v,i)=>({loja_id:loja,vendedora:v.nome,status:'disp',desde:new Date().toISOString(),ordem:D.fila.length+i+1}));
  const r=await sb.from('fila').upsert(linhas,{onConflict:'loja_id,vendedora'}).select();
  if(!r.error&&r.data) D.fila.push(...r.data);
}
async function recarregar(){ await carregarDia(); render(); }
async function carregarPeriodo(){
  const alvo = varias() ? lojas.map(x=>x.id) : [eu.loja_id];
  const f=q=>q.in('loja_id',alvo).gte('data',R.de).lte('data',R.ate);
  const r=await Promise.all([
    f(sb.from('vendas').select('*')),
    f(sb.from('atendimentos').select('*')),
    f(sb.from('caixa_mov').select('*')),
    f(sb.from('despesas').select('*')),
    f(sb.from('atend_manual').select('*')),
    f(sb.from('reaberturas').select('*'))
  ]);
  const err=r.find(x=>x.error);
  if(err){ erro(err.error); return false; }
  R.vendas=r[0].data||[]; R.at=r[1].data||[]; R.mov=r[2].data||[];
  R.desp=r[3].data||[]; R.am=r[4].data||[]; R.reab=r[5].data||[]; R.carregado=true;
  return true;
}
function csv(linhas){

    const t=String(c==null?'':c);

  }).join(';')).join('\n');
}

/* ===================== métricas ===================== */
function apura(linhas){
  const r={venda:0,s:0,b:0,a:0,tickets:0,porPag:{},porCanal:{}};
  const bol=new Set();
  linhas.forEach((v,i)=>{
    r.venda+= +v.total; r.s+=v.sapatos||0; r.b+=v.bolsas||0; r.a+=v.acessorios||0;
    r.porPag[v.pagamento]=(r.porPag[v.pagamento]||0)+ +v.total;
    r.porCanal[v.canal]=(r.porCanal[v.canal]||0)+ +v.total;
    bol.add(v.boleta?'B'+v.boleta+'|'+v.vendedora:'L'+(v.id||i));
  });
  r.tickets=bol.size; r.pecas=r.s+r.b+r.a;
  r.va=r.tickets?r.venda/r.tickets:0;
  r.pa=r.tickets?r.pecas/r.tickets:0;
  r.bs=r.s?r.b/r.s*100:0;
  return r;
}
function caixaDia(){
  const dinh=D.vendas.filter(v=>v.pagamento==='DINHEIRO').reduce((a,b)=>a+ +b.total,0);
  const san=D.mov.filter(m=>m.tipo==='sangria').reduce((a,b)=>a+ +b.valor,0);
  const ent=D.mov.filter(m=>m.tipo==='entrada').reduce((a,b)=>a+ +b.valor,0);
  const ci=+((D.dia&&D.dia.caixa_ini)||0), co=+((D.dia&&D.dia.caixa_outros)||0);
  return {dinh,san,ent,ini:ci,gaveta:ci+dinh+ent-san+co};
}
const st=n=>D.fila.find(f=>f.vendedora===n)||{status:'disp',desde:null,ordem:0};
const filaDisp=()=>equipe(loja).filter(v=>st(v.nome).status==='disp').sort((a,b)=>st(a.nome).ordem-st(b.nome).ordem);
const porSt=s=>equipe(loja).filter(v=>st(v.nome).status===s);
const proxOrdem=()=>Math.max(0,...D.fila.map(f=>f.ordem||0))+1;
const atendDe=n=>D.at.filter(a=>a.vendedora===n&&a.fim).length
  + (D.am.filter(x=>x.vendedora===n).reduce((a,b)=>a+(+b.qtd||0),0));
// nomes que aparecem no período, mesmo quem já saiu da equipe
function nomesDe(lj, vendas, ats){
  const set=new Set(equipe(lj).map(v=>v.nome));
  (vendas||[]).forEach(v=>{ if(v.loja_id===lj) set.add(v.vendedora); });
  (ats||[]).forEach(a=>{ if(a.loja_id===lj) set.add(a.vendedora); });
  const ordem=equipe(lj).map(v=>v.nome);
  return [...set].sort((a,b)=>{
    const ia=ordem.indexOf(a), ib=ordem.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib) || a.localeCompare(b);
  });
}
function metaDe(lj,nome){ const p=pessoas.find(x=>x.loja_id===lj&&x.nome===nome); return p?+p.meta||0:0; }
// atendimentos de um nome no conjunto carregado (fila encerrada + contagem manual)
function atendPeriodo(nome, ats, ams){
  return (ats||[]).filter(a=>a.vendedora===nome&&a.fim).length
       + (ams||[]).filter(x=>x.vendedora===nome).reduce((a,b)=>a+(+b.qtd||0),0);
}

async function iniciarAt(nome){
  if(D.at.some(a=>a.vendedora===nome&&!a.fim)){ toast(nome+' já está em atendimento'); return; }
  const r=await sb.from('atendimentos').insert({loja_id:loja,data:dia,vendedora:nome}).select().single();
  if(r.error) return erro(r.error);
  D.at.push(r.data);
  await mudarFila(nome,'atend');
}
async function mudarFila(nome,status,motivo){
  const linha={loja_id:loja,vendedora:nome,status,desde:new Date().toISOString(),motivo:motivo||null};
  if(status==='disp') linha.ordem=proxOrdem();
  const r=await sb.from('fila').upsert(linha,{onConflict:'loja_id,vendedora'}).select().single();
  if(r.error) return erro(r.error);
  const i=D.fila.findIndex(f=>f.vendedora===nome);
  if(i>=0) D.fila[i]=r.data; else D.fila.push(r.data);
  render();
}
async function encerrarAt(nome,dados,venda){
  const a=D.at.filter(x=>x.vendedora===nome&&!x.fim).pop();
  if(!a){ toast('Atendimento não encontrado'); return; }
  const upd={fim:new Date().toISOString()}; Object.assign(upd,dados);
  const r=await sb.from('atendimentos').update(upd).eq('id',a.id).select().single();
  if(r.error) return erro(r.error);
  Object.assign(a,r.data);
  if(venda&&venda.length){
    const linhas=venda.map(v=>{const o={loja_id:loja,data:dia,atendimento_id:a.id,origem:'fila'};return Object.assign(o,v);});
    const rv=await sb.from('vendas').insert(linhas).select();
    if(rv.error) return erro(rv.error);
    D.vendas.push(...rv.data);
    toast('Venda de R$ '+brl(dados.valor)+' lançada para '+nome);
  }
  await mudarFila(nome,'disp');
}

        <th class="r" style="width:82px">Manual</th><th class="r">Conv.</th></tr></thead>
      <tbody>${equipe(loja).map(v=>{
        const kv=apura(D.vendas.filter(x=>x.vendedora===v.nome));

        const man=D.am.filter(x=>x.vendedora===v.nome).reduce((a,b)=>a+(+b.qtd||0),0);
        const tot=fila+man;
        return `<tr><td>${esc(v.nome)}<div style="font-size:11.5px;color:var(--muted)">${kv.tickets} ticket${kv.tickets===1?'':'s'}</div></td>

};

/* ===================== tela: caixa (gestor) ===================== */

        <div class="fld"><label>Valor R$</label><input id="cx_val" inputmode="decimal" placeholder="500,00"></div>
        <div class="fld"><label>${tipoMov==='sangria'?'Destino':'Origem'}</label><select id="cx_dest">${DEST.map(x=>`<option>${x}</option>`).join('')}</select></div>

      <p class="note">${tipoMov==='sangria'?'Sangria com destino “pagamento de despesa” já entra sozinha em Despesas.':'Suprimento é dinheiro que entra sem ser venda.'}</p>
    </div></div>`}
    <div class="card"><h3>Movimentos de ${labelDia(dia)}</h3>
      ${D.mov.length?`<table><thead><tr><th>Hora</th><th>Tipo</th><th>Quem</th><th>Destino</th><th>Autorizado</th><th class="r">Valor</th><th></th></tr></thead>
        <tbody>${D.mov.slice().reverse().map(m=>{const sai=m.tipo==='sangria';return `<tr>
          <td class="num" style="color:var(--muted)">${hhmm(m.criado_em)}</td>
          <td><span class="tag ${sai?'':'k'}">${sai?'Sangria':'Suprimento'}</span></td>
          <td>${esc(m.quem)}</td>
          <td>${esc(m.destino||'')}${m.obs?`<div style="font-size:11.5px;color:var(--muted)">${esc(m.obs)}</div>`:''}</td>
          <td>${m.autorizado_por?esc(m.autorizado_por):'<span style="color:var(--faint)">—</span>'}</td>
          <td class="r num" style="color:${sai?'var(--bad)':'var(--ok)'}">${sai?'−':'+'} ${brl(m.valor)}</td>
          <td class="r"><button class="del" data-rmc="${m.id}">×</button></td></tr>`;}).join('')}
        <tr class="tot"><td colspan="5">Saldo dos movimentos</td><td class="r num">${brl(c.ent-c.san)}</td><td></td></tr></tbody></table>`

      <div style="display:flex;align-items:center;gap:10px"><div style="flex:1">Contagem no fechamento</div>
        <input style="width:112px" class="num r" inputmode="decimal" data-cx="caixa_conf" value="${conf?brl(conf):''}" placeholder="0,00"></div>
      <div style="display:flex;gap:10px;border-top:1px solid var(--line2);padding-top:10px"><div style="flex:1">Esperado</div><b class="num">R$ ${brl(c.gaveta)}</b></div>
      ${conf?(function(){const df=+conf-c.gaveta,ok=Math.abs(df)<0.005;
        return `<div style="display:flex;gap:10px"><div style="flex:1">Diferença</div><b class="num ${ok?'up':'dn'}">${ok?'confere':(df>0?'+':'')+brl(df)}</b></div>`;})():''}
      <p class="note" style="margin:0">Diferença apurada na hora é diferença que ainda dá para explicar.</p>
    </div></div>
    <div class="card"><h3>Sangrias de ${labelMes(mesPainel)}</h3><div class="pad" style="display:grid;gap:9px">
      <div style="display:flex"><div style="flex:1;color:var(--muted)">Total retirado</div><b class="num">R$ ${brl(sanMes)}</b></div>
      <div style="display:flex"><div style="flex:1;color:var(--muted)">Retiradas</div><b class="num">${qtdMes}</b></div>
      <div style="display:flex"><div style="flex:1;color:var(--muted)">Média</div><b class="num">R$ ${brl(qtdMes?sanMes/qtdMes:0)}</b></div>

        <tbody>${minhas.slice().reverse().map(m=>`<tr><td class="num" style="color:var(--muted)">${hhmm(m.criado_em)}</td>
          <td>${esc(m.destino||'')}${m.obs?`<div style="font-size:11.5px;color:var(--muted)">${esc(m.obs)}</div>`:''}</td>

/* ===================== tela: painel ===================== */
telas.painel = () => {
  const Lo=L(), vd=M.vendas.filter(v=>v.loja_id===loja), k=apura(vd);
  const ats=M.at.filter(a=>a.loja_id===loja&&a.fim);
  const ams=M.am.filter(a=>a.loja_id===loja);
  const nomes=nomesDe(loja, vd, ats);
  const at={length: nomes.reduce((a,n)=>a+atendPeriodo(n,ats,ams),0)};
  const conv=at.length?k.tickets/at.length*100:0;
  const dias=Object.keys(vd.reduce((o,v)=>{o[v.data]=1;return o;},{})).sort();
  const nD=diasNoMes(mesPainel), proj=dias.length?k.venda/dias.length*nD:0;
  const totDia=dt=>vd.filter(v=>v.data===dt).reduce((a,b)=>a+ +b.total,0);
  const max=Math.max(1,...dias.map(totDia));
  const kpi=(nome,val,meta,fmt,suf)=>{const p=meta?val/meta*100:0;
    return `<div class="kpi"><div class="k">${nome}</div><div class="v num">${fmt}${suf||''}</div>
      <div class="bar"><i class="${p>=100?'ok':''}" style="width:${Math.min(100,p)}%"></i></div>
      <div class="pct">${meta?`<b>${dec(p,0)}%</b> da meta`:'sem meta'}</div></div>`;};
  const perdas=M.at.filter(a=>a.loja_id===loja&&a.vendeu===false);
  const porM={}; perdas.forEach(p=>{const m=p.motivo||'—';porM[m]=(porM[m]||0)+1;});
  return `
  <div class="head"><div><h1>Painel de ${labelMes(mesPainel)}</h1>
    <p>${dias.length} dia${dias.length===1?'':'s'} com venda · ${k.tickets} tickets · ${at.length} atendimentos</p></div>
    <div class="spacer"></div>${selLoja()}${selMes()}</div>
  ${!vd.length?`<div class="card"><div class="empty"><b>Nenhum lançamento em ${labelMes(mesPainel)}</b>Comece pela Lista da vez.</div></div>`:`
  <div class="kpis" style="margin-bottom:14px">
    ${kpi('Faturamento',k.venda,Lo.meta,'R$ '+brl0(k.venda))}
    ${kpi('V/A',k.va,Lo.mva,'R$ '+dec(k.va))}
    ${kpi('P/A',k.pa,Lo.mpa,dec(k.pa))}
    ${kpi('B/S',k.bs,Lo.mbs,dec(k.bs,1),'%')}
    ${kpi('Conversão',conv,Lo.mcv,dec(conv,1),'%')}
  </div>
  <div class="grid2"><div>
    <div class="card" style="margin-bottom:14px"><h3>Venda por dia</h3><div class="pad">
      <div class="chart">${dias.map(dt=>`<div style="height:${Math.max(2,totDia(dt)/max*100)}%" class="${dt===dia?'hi':''}" title="${labelDia(dt)} — R$ ${brl(totDia(dt))}"></div>`).join('')}</div>
      <div class="xlab">${dias.map(dt=>`<span>${dt.slice(8)}</span>`).join('')}</div></div></div>
    <div class="card"><h3>Vendedoras</h3><table>
      <thead><tr><th>Nome</th><th class="r">Venda</th><th class="r">% meta</th><th class="r">Tickets</th><th class="r">V/A</th><th class="r">P/A</th><th class="r">B/S</th><th class="r">Conv.</th><th class="r">Dias s/ venda</th></tr></thead>
      <tbody>${nomes.map(nm=>{
        const v={nome:nm, meta:metaDe(loja,nm)};
        const kv=apura(vd.filter(x=>x.vendedora===v.nome));
        const av=atendPeriodo(v.nome,ats,ams);
        const cv=av?kv.tickets/av*100:0;
        const sem=dias.filter(dt=>!vd.some(x=>x.data===dt&&x.vendedora===v.nome)).length;
        const pm=v.meta?kv.venda/v.meta*100:0;
        if(!kv.venda&&!av) return '';
        return `<tr><td>${esc(v.nome)}</td><td class="r num">${brl0(kv.venda)}</td>
          <td class="r num ${pm>=100?'up':''}">${v.meta?dec(pm,0)+'%':'—'}</td>
          <td class="r num">${kv.tickets}</td><td class="r num">${dec(kv.va)}</td><td class="r num">${dec(kv.pa)}</td>
          <td class="r num">${dec(kv.bs,1)}%</td><td class="r num">${av?dec(cv,0)+'%':'—'}</td>
          <td class="r num ${sem>=5?'dn':''}">${sem}</td></tr>`;}).join('')}
        <tr class="tot"><td>Total</td><td class="r num">${brl0(k.venda)}</td><td class="r num">${dec(Lo.meta?k.venda/Lo.meta*100:0,0)}%</td>
          <td class="r num">${k.tickets}</td><td class="r num">${dec(k.va)}</td><td class="r num">${dec(k.pa)}</td>
          <td class="r num">${dec(k.bs,1)}%</td><td class="r num">${at.length?dec(conv,0)+'%':'—'}</td><td></td></tr>
      </tbody></table></div>
  </div><div>
    <div class="card" style="margin-bottom:14px"><h3>Ritmo</h3><div class="pad" style="display:grid;gap:9px">
      <div style="display:flex"><div style="flex:1;color:var(--muted)">Média por dia</div><b class="num">R$ ${brl0(dias.length?k.venda/dias.length:0)}</b></div>
      <div style="display:flex"><div style="flex:1;color:var(--muted)">Projeção do mês</div><b class="num">R$ ${brl0(proj)}</b></div>
      <div style="display:flex"><div style="flex:1;color:var(--muted)">Falta para a meta</div><b class="num ${k.venda>=Lo.meta?'up':''}">R$ ${brl0(Math.max(0,Lo.meta-k.venda))}</b></div>
      <p class="note" style="margin:0">Projeção = média dos dias com venda × ${nD} dias.</p></div></div>
    <div class="card" style="margin-bottom:14px"><h3>Recebimento por forma</h3><table><tbody>
      ${PAG.filter(x=>k.porPag[x]).sort((a,b)=>k.porPag[b]-k.porPag[a]).map(x=>{
        const pc=k.porPag[x]/k.venda*100;
        return `<tr><td style="width:40%">${x}<div class="bar" style="margin-top:5px"><i style="width:${pc}%"></i></div></td>
          <td class="r num">${brl0(k.porPag[x])}<div style="font-size:11.5px;color:var(--muted)">${dec(pc,1)}%</div></td></tr>`;}).join('')}
      ${(()=>{const av=['DINHEIRO','PIX','DEBITO','CREDITO AV'].reduce((a,x)=>a+(k.porPag[x]||0),0);
        const pz=['CREDITO X','LINK ZZNET','OUTROS'].reduce((a,x)=>a+(k.porPag[x]||0),0);
        if(!k.venda) return '';
        return `<tr class="tot"><td>Entra à vista</td><td class="r num">${dec(av/k.venda*100,1)}%</td></tr>
                <tr><td style="color:var(--muted)">Entra parcelado</td><td class="r num" style="color:var(--muted)">${dec(pz/k.venda*100,1)}%</td></tr>`;})()}
    </tbody></table><div class="pad" style="border-top:1px solid var(--line2)"><p class="note" style="margin:0">
      À vista = dinheiro, pix, débito e crédito em uma parcela.</p></div></div>

    <div class="card" style="margin-bottom:14px"><h3>Peças e canais</h3><table><tbody>
      <tr><td>Sapatos</td><td class="r num">${k.s}</td></tr>
      <tr><td>Bolsas</td><td class="r num">${k.b}</td></tr>
      <tr><td>Acessórios</td><td class="r num">${k.a}</td></tr>
      ${CAN.filter(c=>k.porCanal[c]).map(c=>`<tr><td style="color:var(--muted)">${c}</td><td class="r num">${brl0(k.porCanal[c])} <span class="tag">${dec(k.porCanal[c]/k.venda*100,0)}%</span></td></tr>`).join('')}
    </tbody></table></div>
    ${perdas.length?`<div class="card"><h3>Por que não vendeu</h3><table><tbody>
      ${Object.keys(porM).sort((a,b)=>porM[b]-porM[a]).slice(0,6).map(m=>`<tr><td>${esc(m)}</td><td class="r num">${porM[m]} <span class="tag">${dec(porM[m]/perdas.length*100,0)}%</span></td></tr>`).join('')}
    </tbody></table></div>`:''}
  </div></div>`}`;
};



/* ===================== tela: perda de oportunidade ===================== */
telas.perdas = () => {
  const ats = M.at.filter(a=>a.loja_id===loja && a.fim);
  const vend = ats.filter(a=>a.vendeu===true);
  const perd = ats.filter(a=>a.vendeu===false);
  const vd = M.vendas.filter(v=>v.loja_id===loja);
  const ticketMedio = (()=>{ const k=apura(vd); return k.tickets?k.venda/k.tickets:0; })();

  const cab = `
  <div class="head"><div><h1>Perda de oportunidade</h1>
    <p>${labelMes(mesPainel)} · o que entrou na loja e saiu sem comprar</p></div>
    <div class="spacer"></div>${selLoja()}${selMes()}</div>`;

  if(!ats.length) return cab + `<div class="card"><div class="empty">
    <b>Nada registrado em ${labelMes(mesPainel)}</b>
    Este painel se enche sozinho conforme a equipe encerra os atendimentos na Lista da vez,
    marcando se vendeu e, quando não vendeu, o motivo.</div></div>`;

  const taxa = perd.length/ats.length*100;
  const valorPerdido = perd.reduce((a,b)=>a+ (+b.valor||0), 0);
  const comValor = perd.filter(a=>+a.valor>0).length;
  const estimado = perd.length*ticketMedio;

  const porM={}, valM={};
  perd.forEach(a=>{ const m=a.motivo||'—'; porM[m]=(porM[m]||0)+1; valM[m]=(valM[m]||0)+ (+a.valor||0); });
  const motOrd=Object.keys(porM).sort((a,b)=>porM[b]-porM[a]);
  const maxM=Math.max(1,...Object.values(porM));

  const sku={};
  perd.filter(a=>a.sku).forEach(a=>{ const k=a.sku.trim().toUpperCase();
    sku[k]=sku[k]||{q:0,v:0,m:{}}; sku[k].q++; sku[k].v+= +a.valor||0;
    sku[k].m[a.motivo||'—']=(sku[k].m[a.motivo||'—']||0)+1; });
  const skuOrd=Object.keys(sku).sort((a,b)=>sku[b].q-sku[a].q);

  // por faixa de horário — onde falta gente e onde sobra
  const hora={};
  ats.forEach(a=>{ const h=new Date(a.inicio).getHours();
    hora[h]=hora[h]||{t:0,v:0}; hora[h].t++; if(a.vendeu) hora[h].v++; });
  const hs=Object.keys(hora).map(Number).sort((a,b)=>a-b);
  const maxH=Math.max(1,...hs.map(h=>hora[h].t));

  const nomes=nomesDe(loja, vd, ats);

  return cab + `
  <div class="kpis" style="margin-bottom:14px">
    <div class="kpi"><div class="k">Atendimentos</div><div class="v num">${ats.length}</div>
      <div class="pct">${vend.length} viraram venda</div></div>
    <div class="kpi"><div class="k">Perdidos</div><div class="v num">${perd.length}</div>
      <div class="bar"><i style="width:${taxa}%;background:var(--bad)"></i></div>
      <div class="pct"><b>${dec(taxa,1)}%</b> dos atendimentos</div></div>
    <div class="kpi"><div class="k">Valor identificado</div><div class="v num">R$ ${brl0(valorPerdido)}</div>
      <div class="pct">de ${comValor} perda${comValor===1?'':'s'} com produto anotado</div></div>
    <div class="kpi"><div class="k">Perda estimada</div><div class="v num">R$ ${brl0(estimado)}</div>
      <div class="pct">${perd.length} × ticket médio de ${brl0(ticketMedio)}</div></div>
  </div>

  <div class="grid2"><div>
    <div class="card" style="margin-bottom:14px"><h3>Motivos</h3>
      <table><thead><tr><th>Motivo</th><th style="width:110px"></th><th class="r">Vezes</th><th class="r">%</th><th class="r">Valor</th></tr></thead>
      <tbody>${motOrd.map(m=>`<tr><td>${esc(m)}</td>
        <td><div class="bar"><i style="width:${porM[m]/maxM*100}%"></i></div></td>
        <td class="r num">${porM[m]}</td><td class="r num">${dec(porM[m]/perd.length*100,0)}%</td>
        <td class="r num">${valM[m]?brl0(valM[m]):'—'}</td></tr>`).join('')}
        <tr class="tot"><td colspan="2">Total</td><td class="r num">${perd.length}</td><td></td>
          <td class="r num">${brl0(valorPerdido)}</td></tr></tbody></table></div>

    ${skuOrd.length?`<div class="card" style="margin-bottom:14px"><h3>Demanda reprimida — produtos que faltaram</h3>
      <table><thead><tr><th>SKU procurado</th><th class="r">Vezes</th><th class="r">Valor</th><th>Motivo</th></tr></thead>
      <tbody>${skuOrd.slice(0,20).map(k=>{
        const top=Object.keys(sku[k].m).sort((a,b)=>sku[k].m[b]-sku[k].m[a])[0];
        return `<tr><td class="num"><b>${esc(k)}</b></td><td class="r num">${sku[k].q}</td>
          <td class="r num">${sku[k].v?brl(sku[k].v):'—'}</td>
          <td style="color:var(--muted);font-size:12.5px">${esc(top)}</td></tr>`;}).join('')}
      </tbody></table>
      <div class="pad" style="border-top:1px solid var(--line2)"><p class="note" style="margin:0">
        É esta lista que vira pedido de reposição. Um SKU que aparece três vezes no mês é ruptura, não azar.</p></div></div>`:''}

    <div class="card"><h3>Por vendedora</h3>
      <table><thead><tr><th>Nome</th><th class="r">Atend.</th><th class="r">Vendeu</th><th class="r">Perdeu</th>
        <th class="r">Taxa de perda</th><th>Motivo mais comum</th></tr></thead>
      <tbody>${nomes.map(n=>{
        const meus=ats.filter(a=>a.vendedora===n);
        if(!meus.length) return '';
        const p=meus.filter(a=>a.vendeu===false);
        const mm={}; p.forEach(a=>{const k=a.motivo||'—';mm[k]=(mm[k]||0)+1;});
        const top=Object.keys(mm).sort((a,b)=>mm[b]-mm[a])[0]||'—';
        const tx=p.length/meus.length*100;
        return `<tr><td>${esc(n)}</td><td class="r num">${meus.length}</td>
          <td class="r num">${meus.length-p.length}</td><td class="r num">${p.length}</td>
          <td class="r num ${tx>taxa+10?'dn':(tx<taxa-10?'up':'')}">${dec(tx,0)}%</td>
          <td style="color:var(--muted);font-size:12.5px">${esc(top)}</td></tr>`;}).join('')}
      </tbody></table>
      <div class="pad" style="border-top:1px solid var(--line2)"><p class="note" style="margin:0">
        Vermelho é quem está 10 pontos acima da média da loja; verde, 10 abaixo.</p></div></div>
  </div><div>
    <div class="card" style="margin-bottom:14px"><h3>Por faixa de horário</h3>
      <table><thead><tr><th>Hora</th><th style="width:70px"></th><th class="r">Atend.</th><th class="r">Conv.</th></tr></thead>
      <tbody>${hs.map(h=>{
        const cv=hora[h].v/hora[h].t*100;
        return `<tr><td class="num">${String(h).padStart(2,'0')}h</td>
          <td><div class="bar"><i style="width:${hora[h].t/maxH*100}%"></i></div></td>
          <td class="r num">${hora[h].t}</td>
          <td class="r num ${cv<40?'dn':''}">${dec(cv,0)}%</td></tr>`;}).join('')}
      </tbody></table>
      <div class="pad" style="border-top:1px solid var(--line2)"><p class="note" style="margin:0">
        Muito movimento com conversão baixa costuma ser falta de gente no salão naquele horário.</p></div></div>

    <div class="card"><h3>Onde atacar primeiro</h3><div class="pad">
      ${(()=>{
        const dicas=[];
        const rup=motOrd.filter(m=>/FALT|RESERVA/.test(m)).reduce((a,m)=>a+porM[m],0);
        if(rup) dicas.push(`<b>${dec(rup/perd.length*100,0)}% das perdas são falta de produto.</b> São ${rup} clientes que queriam comprar e a loja não tinha. A lista de SKUs ao lado é o pedido.`);
        const preco=motOrd.filter(m=>/CARO|PREÇO/.test(m)).reduce((a,m)=>a+porM[m],0);
        if(preco) dicas.push(`<b>${dec(preco/perd.length*100,0)}% saíram por preço.</b> Vale testar argumentação de parcelamento antes de mexer em desconto.`);
        const pensar=motOrd.filter(m=>/PENSAR|VOLTA/.test(m)).reduce((a,m)=>a+porM[m],0);
        if(pensar) dicas.push(`<b>${pensar} clientes disseram que voltam depois.</b> É a fila natural para follow-up no WhatsApp.`);
        const pior=hs.filter(h=>hora[h].t>=5).sort((a,b)=>(hora[a].v/hora[a].t)-(hora[b].v/hora[b].t))[0];
        if(pior!==undefined) dicas.push(`O horário mais fraco é <b>${String(pior).padStart(2,'0')}h</b>, com ${dec(hora[pior].v/hora[pior].t*100,0)}% de conversão em ${hora[pior].t} atendimentos.`);
        return dicas.length?dicas.map(d=>`<p style="margin:0 0 11px;color:var(--muted)">${d}</p>`).join(''):
          '<p style="margin:0;color:var(--muted)">Ainda faltam dados para apontar um foco.</p>';
      })()}
    </div></div>
  </div></div>`;
};

/* ===================== tela: relatório por período ===================== */
telas.relatorio = () => {
  const alvo = varias()?lojas:lojas.filter(x=>x.id===eu.loja_id);
  const cab = `
  <div class="head"><div><h1>Relatório por período</h1>
    <p>Escolha as datas. Vale para qualquer intervalo, inclusive atravessando meses.</p></div></div>
  <div class="card" style="margin-bottom:14px"><div class="pad">
    <div class="entry" style="grid-template-columns:150px 150px 1fr auto auto">
      <div class="fld"><label>De</label><input type="date" id="rp_de" value="${R.de}"></div>
      <div class="fld"><label>Até</label><input type="date" id="rp_ate" value="${R.ate}"></div>
      <div class="fld"><label>Atalhos</label><div class="seg" style="width:100%">
        <button data-rp="30">30 dias</button><button data-rp="90">90 dias</button><button data-rp="ano">Tudo</button></div></div>
      <button class="btn" id="rp_go">Gerar</button>
      ${R.carregado?'<button class="btn gh" id="rp_menu">Exportar ▾</button>':''}
    </div>
  </div></div>`;

  const exportador = !R.carregado ? '' : `
  <div class="card" style="margin-bottom:14px"><h3>Exportar para Excel</h3><div class="pad">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn gh sm" data-exp="vendas">Vendas linha a linha</button>
      <button class="btn gh sm" data-exp="diario">Resumo por dia</button>
      <button class="btn gh sm" data-exp="vendedora">Desempenho por vendedora</button>
      <button class="btn gh sm" data-exp="sku">SKUs perdidos</button>
      <button class="btn gh sm" data-exp="atendimentos">Atendimentos e motivos</button>
      <button class="btn gh sm" data-exp="caixa">Sangrias e suprimentos</button>
      <button class="btn gh sm" data-exp="despesas">Despesas</button>
      <button class="btn gh sm" data-exp="reaberturas">Reaberturas de dia</button>
    </div>
    <p class="note">Arquivos .csv separados por ponto e vírgula, abrem direto no Excel em português.</p>
  </div></div>`;

  if(!R.carregado) return cab + `<div class="card"><div class="empty">
    <b>Escolha o período e clique em Gerar</b>Os atalhos preenchem as datas para você.</div></div>`;

  const kT=apura(R.vendas);
  const nDias=Math.round((new Date(R.ate)-new Date(R.de))/86400000)+1;
  const diasComVenda=Object.keys(R.vendas.reduce((o,v)=>{o[v.data]=1;return o;},{})).length;
  const atTot=alvo.reduce((a,lo)=>a+nomesDe(lo.id,R.vendas,R.at).reduce((x,n)=>
    x+atendPeriodo(n,R.at.filter(z=>z.loja_id===lo.id),R.am.filter(z=>z.loja_id===lo.id)),0),0);
  const convT=atTot?kT.tickets/atTot*100:0;
  const sanT=R.mov.filter(m=>m.tipo==='sangria').reduce((a,b)=>a+ +b.valor,0);
  const despT=R.desp.reduce((a,b)=>a+ +b.valor,0);

  const cartao=(t,v,sub)=>`<div class="kpi"><div class="k">${t}</div><div class="v num">${v}</div>
    <div class="pct">${sub||''}</div></div>`;

  const porLoja = alvo.map(lo=>{
    const vd=R.vendas.filter(v=>v.loja_id===lo.id);
    if(!vd.length) return '';
    const ats=R.at.filter(a=>a.loja_id===lo.id), ams=R.am.filter(a=>a.loja_id===lo.id);
    const k=apura(vd);
    const linhas=nomesDe(lo.id,vd,ats).map(n=>{
      const kv=apura(vd.filter(x=>x.vendedora===n));
      const av=atendPeriodo(n,ats,ams);
      const dias=Object.keys(vd.reduce((o,v)=>{o[v.data]=1;return o;},{}));
      const sem=dias.filter(dt=>!vd.some(x=>x.data===dt&&x.vendedora===n)).length;
      return {n,av,sem,...kv};
    }).filter(x=>x.venda||x.av).sort((a,b)=>b.venda-a.venda);
    return `<div class="card" style="margin-bottom:14px"><h3>${esc(lo.nome)} — R$ ${brl0(k.venda)}</h3>
      <table><thead><tr><th>Vendedora</th><th class="r">Venda</th><th class="r">Part.</th><th class="r">Tickets</th>
        <th class="r">V/A</th><th class="r">P/A</th><th class="r">B/S</th><th class="r">Atend.</th>
        <th class="r">Conv.</th><th class="r">Dias s/ venda</th></tr></thead>
      <tbody>${linhas.map(x=>`<tr><td>${esc(x.n)}</td><td class="r num">${brl0(x.venda)}</td>
        <td class="r num" style="color:var(--muted)">${dec(x.venda/k.venda*100,0)}%</td>
        <td class="r num">${x.tickets}</td><td class="r num">${dec(x.va)}</td><td class="r num">${dec(x.pa)}</td>
        <td class="r num">${dec(x.bs,1)}%</td><td class="r num">${x.av||'—'}</td>
        <td class="r num">${x.av?dec(x.tickets/x.av*100,0)+'%':'—'}</td>
        <td class="r num ${x.sem>=5?'dn':''}">${x.sem}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td class="r num">${brl0(k.venda)}</td><td></td>
          <td class="r num">${k.tickets}</td><td class="r num">${dec(k.va)}</td><td class="r num">${dec(k.pa)}</td>
          <td class="r num">${dec(k.bs,1)}%</td><td colspan="3"></td></tr></tbody></table></div>`;
  }).join('');

  const mes={};
  R.vendas.forEach(v=>{ const m=v.data.slice(0,7); mes[m]=(mes[m]||0)+ +v.total; });
  const mx=Math.max(1,...Object.values(mes));

  const perdas=R.at.filter(a=>a.vendeu===false), porM={};
  perdas.forEach(a=>{const m=a.motivo||'—';porM[m]=(porM[m]||0)+1;});
  const sku={};
  R.at.filter(a=>a.sku).forEach(a=>{ sku[a.sku]=sku[a.sku]||{q:0,v:0}; sku[a.sku].q++; sku[a.sku].v+= +a.valor||0; });

  return cab + exportador + `
  <div class="kpis" style="margin-bottom:14px">
    ${cartao('Faturamento','R$ '+brl0(kT.venda), `${diasComVenda} de ${nDias} dias com venda`)}
    ${cartao('Tickets', kT.tickets, 'V/A R$ '+dec(kT.va))}
    ${cartao('Peças', kT.pecas, 'P/A '+dec(kT.pa))}
    ${cartao('Conversão', atTot?dec(convT,1)+'%':'—', atTot?atTot+' atendimentos':'sem contagem no período')}
    ${cartao('Média por dia','R$ '+brl0(diasComVenda?kT.venda/diasComVenda:0), 'sobre dias com venda')}
    ${cartao('Sangrias','R$ '+brl0(sanT), R.mov.filter(m=>m.tipo==='sangria').length+' retiradas')}
  </div>
  ${porLoja}
  <div class="grid2">
    <div>
      <div class="card" style="margin-bottom:14px"><h3>Evolução mensal</h3><div class="pad">
        <div class="chart">${Object.keys(mes).sort().map(m=>`<div style="height:${Math.max(3,mes[m]/mx*100)}%" title="${labelMes(m)} — R$ ${brl(mes[m])}"></div>`).join('')}</div>
        <div class="xlab">${Object.keys(mes).sort().map(m=>`<span>${labelMes(m)}</span>`).join('')}</div>
        <table style="margin-top:12px"><tbody>${Object.keys(mes).sort().map(m=>
          `<tr><td>${labelMes(m)}</td><td class="r num">${brl0(mes[m])}</td></tr>`).join('')}</tbody></table>
      </div></div>
      ${Object.keys(sku).length?`<div class="card"><h3>Demanda reprimida</h3>
        <table><thead><tr><th>SKU procurado</th><th class="r">Vezes</th><th class="r">Valor perdido</th></tr></thead>
        <tbody>${Object.keys(sku).sort((a,b)=>sku[b].q-sku[a].q).slice(0,15).map(k=>
          `<tr><td class="num">${esc(k)}</td><td class="r num">${sku[k].q}</td><td class="r num">${brl(sku[k].v)}</td></tr>`).join('')}
        </tbody></table></div>`:''}
    </div>
    <div>
      <div class="card" style="margin-bottom:14px"><h3>Formas de pagamento</h3><table><tbody>
        ${PAG.filter(x=>kT.porPag[x]).sort((a,b)=>kT.porPag[b]-kT.porPag[a]).map(x=>
          `<tr><td>${x}</td><td class="r num">${brl0(kT.porPag[x])} <span class="tag">${dec(kT.porPag[x]/kT.venda*100,0)}%</span></td></tr>`).join('')}
      </tbody></table></div>
      <div class="card" style="margin-bottom:14px"><h3>Canais e peças</h3><table><tbody>
        ${CAN.filter(c=>kT.porCanal[c]).map(c=>`<tr><td>${c}</td><td class="r num">${brl0(kT.porCanal[c])} <span class="tag">${dec(kT.porCanal[c]/kT.venda*100,0)}%</span></td></tr>`).join('')}
        <tr><td style="color:var(--muted)">Sapatos</td><td class="r num">${kT.s}</td></tr>
        <tr><td style="color:var(--muted)">Bolsas</td><td class="r num">${kT.b}</td></tr>
        <tr><td style="color:var(--muted)">Acessórios</td><td class="r num">${kT.a}</td></tr>
      </tbody></table></div>
      ${perdas.length?`<div class="card" style="margin-bottom:14px"><h3>Por que não vendeu</h3><table><tbody>
        ${Object.keys(porM).sort((a,b)=>porM[b]-porM[a]).map(m=>
          `<tr><td>${esc(m)}</td><td class="r num">${porM[m]} <span class="tag">${dec(porM[m]/perdas.length*100,0)}%</span></td></tr>`).join('')}
      </tbody></table></div>`:''}
      ${R.reab.length?`<div class="card" style="margin-bottom:14px"><h3>Reaberturas de dia</h3>
        <table><thead><tr><th>Loja</th><th>Dia</th><th>Quem</th><th>Motivo</th></tr></thead>
        <tbody>${R.reab.slice().sort((a,b)=>a.criado_em<b.criado_em?1:-1).map(x=>
          `<tr><td><span class="tag">${esc(x.loja_id)}</span></td>
            <td class="num">${labelDia(x.data)}</td><td>${esc(x.quem)}</td>
            <td style="color:var(--muted);font-size:12.5px">${esc(x.motivo)}
              <div style="font-size:11px;color:var(--faint)">reaberto em ${labelDia(x.criado_em.slice(0,10))} às ${hhmm(x.criado_em)}</div></td></tr>`).join('')}
        </tbody></table>
        <div class="pad" style="border-top:1px solid var(--line2)"><p class="note" style="margin:0">
          Todo dia fechado que voltou a ser editado aparece aqui, com quem pediu e por quê.</p></div></div>`:''}
      ${R.desp.length?`<div class="card"><h3>Despesas do período</h3><table><tbody>
        ${(()=>{const u={};R.desp.forEach(x=>{const k=x.unidade||'—';u[k]=(u[k]||0)+ +x.valor;});
          return Object.keys(u).sort((a,b)=>u[b]-u[a]).map(k=>`<tr><td>${esc(k)}</td><td class="r num">${brl(u[k])}</td></tr>`).join('')
            +`<tr class="tot"><td>Total</td><td class="r num">${brl(despT)}</td></tr>`;})()}
      </tbody></table></div>`:''}
    </div>
  </div>`;
};

/* ===================== tela: equipe ===================== */
telas.equipe = () => {
  const alvo = varias()?lojas:lojas.filter(x=>x.id===eu.loja_id);
  const linhas=[];
  alvo.forEach(lo=>{
    const vd=M.vendas.filter(v=>v.loja_id===lo.id), at=M.at.filter(a=>a.loja_id===lo.id&&a.fim);
    const ams=M.am.filter(a=>a.loja_id===lo.id);
    const dias=Object.keys(vd.reduce((o,v)=>{o[v.data]=1;return o;},{}));
    nomesDe(lo.id,vd,at).forEach(nm=>{
      const kv=apura(vd.filter(x=>x.vendedora===nm));
      const av=atendPeriodo(nm,at,ams);
      if(!kv.venda&&!av) return;
      const o={loja:lo.nome,nome:nm,meta:metaDe(lo.id,nm),av,
        sem:dias.filter(dt=>!vd.some(x=>x.data===dt&&x.vendedora===nm)).length};
      linhas.push(Object.assign(o,kv));
    });
  });
  linhas.sort((a,b)=>b.venda-a.venda);
  const top=linhas.length?linhas[0].venda||1:1;
  return `
  <div class="head"><div><h1>Equipe</h1><p>Ranking de ${labelMes(mesPainel)}.</p></div>
    <div class="spacer"></div>${selMes()}</div>
  <div class="card">${linhas.some(x=>x.venda)?`<table>
    <thead><tr><th>#</th><th>Vendedora</th><th>Loja</th><th class="r">Venda</th><th></th><th class="r">% meta</th>
    <th class="r">Tickets</th><th class="r">V/A</th><th class="r">P/A</th><th class="r">B/S</th><th class="r">Conv.</th><th class="r">Dias s/ venda</th></tr></thead>
    <tbody>${linhas.map((x,i)=>{const pm=x.meta?x.venda/x.meta*100:0, cv=x.av?x.tickets/x.av*100:0;
      return `<tr><td class="num" style="color:var(--faint)">${i+1}</td><td><b>${esc(x.nome)}</b></td>
      <td><span class="tag">${esc(x.loja)}</span></td><td class="r num">${brl0(x.venda)}</td>
      <td style="width:90px"><div class="bar"><i class="${pm>=100?'ok':''}" style="width:${x.venda/top*100}%"></i></div></td>

};

    ${at.length?`<table><thead><tr><th>Dia</th><th>Hora</th><th class="r">Duração</th><th>Resultado</th><th>Motivo</th><th class="r">Valor</th></tr></thead>
      <tbody>${at.slice().reverse().slice(0,40).map(a=>`<tr><td class="num">${labelDia(a.data)}</td>
        <td class="num">${hhmm(a.inicio)}</td><td class="r num">${tempo(dur(a.inicio,a.fim))}</td>
        <td>${a.vendeu?'<span class="tag g">Vendeu</span>':'<span class="tag w">Não vendeu</span>'}</td>
        <td style="color:var(--muted)">${esc(a.motivo||'')}</td>
        <td class="r num">${a.valor?brl(a.valor):''}</td></tr>`).join('')}</tbody></table>`
    :`<div class="empty"><b>Nenhum atendimento no mês</b>Eles aparecem aqui conforme você usa a fila.</div>`}
  </div><div>
    <div class="card"><h3>Meus motivos de perda</h3><table><tbody>
      ${Object.keys(porM).sort((a,b)=>porM[b]-porM[a]).map(m=>`<tr><td>${esc(m)}</td><td class="r num">${porM[m]}</td></tr>`).join('')
        ||'<tr><td class="empty" colspan="2">Nenhuma perda registrada</td></tr>'}
    </tbody></table></div>
  </div></div>`;

/* ===================== eventos ===================== */
document.addEventListener('click', async e=>{
  const t=e.target;
  const nb=t.closest('.navb'); if(nb) return nav(nb.dataset.nav);
  if(t.id==='sair'||t.id==='sair2'){ await sb.auth.signOut(); location.reload(); return; }
  if(t.dataset.loja){ loja=t.dataset.loja; await carregarDia(); await carregarMes(); render(); return; }

  if(t.dataset.ini)   return iniciarAt(t.dataset.ini);
  if(t.dataset.pau)   return modalPausa(t.dataset.pau);
  if(t.dataset.volta) return mudarFila(t.dataset.volta,'disp');
  if(t.dataset.fim)   return modalFim(t.dataset.fim);
  if(t.dataset.x)     return fechar();
  if(t.dataset.pz){ const n=ctx.nome; fechar(); return mudarFila(n,'indisp',t.dataset.pz); }
  if(t.dataset.v!==undefined){ ctx.vendeu=t.dataset.v==='1'; detFim(); return; }

  if(t.id==='okfim'){
    const g=id=>document.getElementById(id);
    const dados={vendeu:ctx.vendeu}; let venda=null;
    if(ctx.vendeu){
      const total=num(g('m_tot').value);
      if(!total){ toast('Informe o total da venda'); g('m_tot').focus(); return; }
      const boleta=(g('m_bol').value||'').trim(), obs=(g('m_obs').value||'').trim();
      const cn=g('m_can').value, s=+g('m_s').value||0, b=+g('m_b').value||0, a=+g('m_a').value||0;
      let v2=0, pag2='';
      const dv=g('m_div');
      if(dv&&dv.checked){
        v2=num(g('m_val2')?g('m_val2').value:0); pag2=g('m_pag2')?g('m_pag2').value:'';
        if(!v2||v2>=total){ toast('O valor da 2ª forma tem que ser menor que o total'); return; }
      }
      venda=[{vendedora:ctx.nome,boleta,pagamento:g('m_pag').value,total:total-v2,
              sapatos:s,bolsas:b,acessorios:a,canal:cn,obs:(v2?'PG 1/2 · ':'')+obs}];
      if(v2) venda.push({vendedora:ctx.nome,boleta,pagamento:pag2,total:v2,
              sapatos:0,bolsas:0,acessorios:0,canal:cn,obs:('PG 2/2 · '+obs).trim()});
      dados.boleta=boleta; dados.valor=total;
    } else {
      if(!ctx.motivo){ toast('Selecione o motivo'); return; }
      const mt=motivos.find(x=>x.texto===ctx.motivo);
      dados.motivo=ctx.motivo;
      if(mt&&mt.exige_sku){
        dados.sku=(g('m_sku')?g('m_sku').value:'').trim();
        dados.valor=num(g('m_val')?g('m_val').value:0);
        if(!dados.sku){ toast('Informe o SKU procurado'); return; }
      }
    }
    const n=ctx.nome; fechar(); return encerrarAt(n,dados,venda);
  }

  if(t.id==='add'){
    const g=id=>document.getElementById(id);
    const total=num(g('f_tot').value);
    if(!total){ g('f_tot').focus(); toast('Informe o total da venda'); return; }
    const r=await sb.from('vendas').insert({loja_id:loja,data:dia,vendedora:g('f_ven').value,
      boleta:g('f_bol').value.trim(),pagamento:g('f_pag').value,total,
      sapatos:+g('f_s').value||0,bolsas:+g('f_b').value||0,acessorios:+g('f_a').value||0,
      canal:g('f_can').value,obs:g('f_obs').value.trim()}).select().single();
    if(r.error) return erro(r.error);
    D.vendas.push(r.data); render();
    const fb=document.getElementById('f_bol'); if(fb) fb.focus();
    return;
  }
  if(t.dataset.rm){
    const r=await sb.from('vendas').delete().eq('id',t.dataset.rm);
    if(r.error) return erro(r.error);
    D.vendas=D.vendas.filter(v=>v.id!==t.dataset.rm); render(); return;
  }

  if(t.dataset.rp){
    const ate=hoje(); let de;
    if(t.dataset.rp==='ano'){ de='2026-02-01'; }
    else { const d=new Date(); d.setDate(d.getDate()-(+t.dataset.rp-1));
           de=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
    R.de=de; R.ate=ate; R.carregado=false; render();
    document.getElementById('rp_go').click(); return;
  }
  if(t.id==='rp_go'){
    R.de=document.getElementById('rp_de').value; R.ate=document.getElementById('rp_ate').value;
    if(!R.de||!R.ate){ toast('Preencha as duas datas'); return; }
    if(R.de>R.ate){ const x=R.de; R.de=R.ate; R.ate=x; }
    t.disabled=true; t.textContent='Buscando…';
    const ok=await carregarPeriodo();
    if(ok) render(); else { t.disabled=false; t.textContent='Gerar'; }
    return;
  }
  if(t.dataset.exp){
    const tipo=t.dataset.exp, n=x=>String(x==null?0:x).replace('.',',');
    const nomeArq=q=>'anacapri-'+q+'-'+R.de+'-a-'+R.ate+'.csv';
    let L=[], qtd=0;

    if(tipo==='vendas'){
      L=[['loja','data','vendedora','boleta','pagamento','total','sapatos','bolsas','acessorios','canal','origem','obs']];
      R.vendas.slice().sort((a,b)=>a.data<b.data?-1:1).forEach(v=>L.push([v.loja_id,v.data,v.vendedora,
        v.boleta,v.pagamento,n(v.total),v.sapatos,v.bolsas,v.acessorios,v.canal,v.origem,v.obs]));
    }

    else if(tipo==='diario'){
      L=[['loja','data','venda','tickets','pecas','V/A','P/A','B/S %','atendimentos','conversao %','sangrias']];
      const ch={};
      R.vendas.forEach(v=>{ const k=v.loja_id+'|'+v.data; (ch[k]=ch[k]||[]).push(v); });
      Object.keys(ch).sort().forEach(k=>{
        const [lj,dt]=k.split('|'), kk=apura(ch[k]);
        const av=R.at.filter(a=>a.loja_id===lj&&a.data===dt&&a.fim).length
                +R.am.filter(a=>a.loja_id===lj&&a.data===dt).reduce((a,b)=>a+(+b.qtd||0),0);
        const sg=R.mov.filter(m=>m.loja_id===lj&&m.data===dt&&m.tipo==='sangria').reduce((a,b)=>a+ +b.valor,0);
        L.push([lj,dt,n(kk.venda.toFixed(2)),kk.tickets,kk.pecas,n(kk.va.toFixed(2)),n(kk.pa.toFixed(2)),
          n(kk.bs.toFixed(1)),av,av?n((kk.tickets/av*100).toFixed(1)):'',n(sg.toFixed(2))]);
      });
    }

    else if(tipo==='vendedora'){
      L=[['loja','vendedora','venda','participacao %','tickets','pecas','V/A','P/A','B/S %',
          'atendimentos','conversao %','atendimentos perdidos','taxa de perda %','dias sem venda','meta','% da meta']];
      (varias()?lojas:lojas.filter(x=>x.id===eu.loja_id)).forEach(lo=>{
        const vd=R.vendas.filter(v=>v.loja_id===lo.id);
        const ats=R.at.filter(a=>a.loja_id===lo.id&&a.fim), ams=R.am.filter(a=>a.loja_id===lo.id);
        const tot=apura(vd).venda||1;
        const dias=Object.keys(vd.reduce((o,v)=>{o[v.data]=1;return o;},{}));
        nomesDe(lo.id,vd,ats).forEach(nm=>{
          const kv=apura(vd.filter(x=>x.vendedora===nm));
          const av=atendPeriodo(nm,ats,ams);
          const meus=ats.filter(a=>a.vendedora===nm), pe=meus.filter(a=>a.vendeu===false).length;
          const mt=metaDe(lo.id,nm);
          if(!kv.venda&&!av) return;
          L.push([lo.nome,nm,n(kv.venda.toFixed(2)),n((kv.venda/tot*100).toFixed(1)),kv.tickets,kv.pecas,
            n(kv.va.toFixed(2)),n(kv.pa.toFixed(2)),n(kv.bs.toFixed(1)),av,
            av?n((kv.tickets/av*100).toFixed(1)):'', pe, meus.length?n((pe/meus.length*100).toFixed(1)):'',
            dias.filter(dt=>!vd.some(x=>x.data===dt&&x.vendedora===nm)).length,
            mt?n(mt):'', mt?n((kv.venda/mt*100).toFixed(1)):'']);
        });
      });
    }

    else if(tipo==='sku'){
      L=[['sku procurado','vezes','valor perdido','motivo mais comum','lojas','vendedoras','ultima vez']];
      const sk={};
      R.at.filter(a=>a.vendeu===false&&a.sku).forEach(a=>{
        const k=a.sku.trim().toUpperCase();
        sk[k]=sk[k]||{q:0,v:0,m:{},lj:new Set(),vd:new Set(),ult:''};
        sk[k].q++; sk[k].v+= +a.valor||0;
        sk[k].m[a.motivo||'—']=(sk[k].m[a.motivo||'—']||0)+1;
        sk[k].lj.add(a.loja_id); sk[k].vd.add(a.vendedora);
        if(a.data>sk[k].ult) sk[k].ult=a.data;
      });
      Object.keys(sk).sort((a,b)=>sk[b].q-sk[a].q).forEach(k=>{
        const x=sk[k], top=Object.keys(x.m).sort((a,b)=>x.m[b]-x.m[a])[0];
        L.push([k,x.q,n(x.v.toFixed(2)),top,[...x.lj].join(' '),[...x.vd].join(' '),x.ult]);
      });
    }

    else if(tipo==='atendimentos'){
      L=[['loja','data','hora','vendedora','duracao min','resultado','motivo','sku','valor','boleta']];
      R.at.filter(a=>a.fim).sort((a,b)=>a.inicio<b.inicio?-1:1).forEach(a=>{
        const d=new Date(a.inicio);
        L.push([a.loja_id,a.data,String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),
          a.vendedora, Math.round((new Date(a.fim)-d)/60000),
          a.vendeu?'vendeu':'nao vendeu', a.motivo||'', a.sku||'', a.valor?n(a.valor):'', a.boleta||'']);
      });
    }

    else if(tipo==='caixa'){
      L=[['loja','data','hora','tipo','valor','quem','destino','autorizado por','observacao']];
      R.mov.slice().sort((a,b)=>a.data<b.data?-1:1).forEach(m=>{
        const d=m.criado_em?new Date(m.criado_em):null;
        L.push([m.loja_id,m.data, d?String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):'',
          m.tipo, n(m.valor), m.quem, m.destino||'', m.autorizado_por||'', m.obs||'']);
      });
    }

    else if(tipo==='despesas'){
      L=[['loja','data','valor','unidade','pago com','descricao']];
      R.desp.slice().sort((a,b)=>a.data<b.data?-1:1).forEach(x=>
        L.push([x.loja_id,x.data,n(x.valor),x.unidade||'',x.pago_com||'',x.descricao||'']));
    }

    else if(tipo==='reaberturas'){
      L=[['loja','dia reaberto','quem','motivo','data da reabertura','hora']];
      R.reab.slice().sort((a,b)=>a.criado_em<b.criado_em?-1:1).forEach(x=>{
        const d=new Date(x.criado_em);
        L.push([x.loja_id,x.data,x.quem,x.motivo,x.criado_em.slice(0,10),
          String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')]);
      });
    }

    qtd=L.length-1;
    if(!qtd){ toast('Não há nada para exportar nesse período'); return; }
    baixar(nomeArq(tipo), csv(L));
    toast(qtd+' linha'+(qtd===1?'':'s')+' exportada'+(qtd===1?'':'s')); return;
  }
  if(t.id==='fechar')  return fecharDia();
  if(t.id==='reabrir') return modalReabrir();
  if(t.id==='rb_ok'){
    const q=(document.getElementById('rb_quem').value||'').trim();
    const m=(document.getElementById('rb_mot').value||'').trim();
    if(q.length<3){ toast('Informe quem está reabrindo'); return; }
    if(m.length<5){ toast('Escreva o motivo da reabertura'); return; }
    fechar(); return reabrirDia(q,m);
  }
  if(t.dataset.tm){ tipoMov=t.dataset.tm; render(); return; }
  if(t.id==='cx_add'){
    const g=id=>document.getElementById(id);
    const c=caixaDia(), lim=+L().limite_sangria||0;
    const val=num(g('cx_val').value);
    if(!val){ g('cx_val').focus(); toast('Informe o valor'); return; }
    const quem = opera()? g('cx_quem').value : eu.nome;
    const aut = g('cx_aut')?g('cx_aut').value:'';
    if(tipoMov==='sangria'){
      if(val>c.gaveta+0.005){ toast('Só há R$ '+brl(c.gaveta)+' na gaveta'); return; }
      if(lim&&val>=lim&&!aut){ toast('Sangria de R$ '+brl0(val)+' precisa de autorização'); return; }
    }
    const destino=g('cx_dest').value, obs=g('cx_obs').value.trim();
    const r=await sb.from('caixa_mov').insert({loja_id:loja,data:dia,tipo:tipoMov,valor:val,quem,destino,obs,
      autorizado_por:(tipoMov==='sangria'&&lim&&val>=lim)?aut:null}).select().single();
    if(r.error) return erro(r.error);
    D.mov.push(r.data);
    let extra='';
    if(tipoMov==='sangria'&&destino==='PAGAMENTO DE DESPESA'){
      const rd=await sb.from('despesas').insert({loja_id:loja,data:dia,valor:val,unidade:'ANACAPRI',
        pago_com:'DINHEIRO (SANGRIA)',descricao:obs||'sangria para pagamento',origem_mov:r.data.id});
      if(!rd.error) extra=' e lançada em Despesas';
    }
    toast(tipoMov==='sangria'?'Sangria de R$ '+brl(val)+' registrada'+extra:'Suprimento registrado');
    render(); return;
  }
  if(t.dataset.rmc){
    const r=await sb.from('caixa_mov').delete().eq('id',t.dataset.rmc);
    if(r.error) return erro(r.error);
    D.mov=D.mov.filter(m=>m.id!==t.dataset.rmc); render(); return;
  }

  if(t.id==='dp_add'){
    const g=id=>document.getElementById(id);
    const v=num(g('dp_v').value);
    if(!v){ g('dp_v').focus(); toast('Informe o valor'); return; }
    const r=await sb.from('despesas').insert({loja_id:loja,data:g('dp_dt').value||dia,valor:v,
      unidade:(g('dp_l').value||'ANACAPRI').toUpperCase(),pago_com:g('dp_c').value.toUpperCase(),
      descricao:g('dp_d').value.trim()}).select().single();
    if(r.error) return erro(r.error);
    M.desp.push(r.data); M.desp.sort((a,b)=>a.data<b.data?-1:1); render(); return;
  }
  if(t.dataset.rmd){
    const r=await sb.from('despesas').delete().eq('id',t.dataset.rmd);
    if(r.error) return erro(r.error);
    M.desp=M.desp.filter(x=>x.id!==t.dataset.rmd); render(); return;
  }

  if(t.dataset.addp){
    const r=await sb.from('pessoas').insert({loja_id:t.dataset.addp,nome:'NOVA',papel:'vendedora',meta:0,ordem:99}).select().single();
    if(r.error) return erro(r.error); pessoas.push(r.data); render(); return;
  }
  if(t.dataset.rmp){
    const r=await sb.from('pessoas').delete().eq('id',t.dataset.rmp);
    if(r.error) return erro(r.error); pessoas=pessoas.filter(p=>p.id!==t.dataset.rmp); render(); return;
  }
  if(t.id==='addm'){
    const r=await sb.from('motivos').insert({texto:'NOVO MOTIVO',exige_sku:false,ordem:99}).select().single();
    if(r.error) return erro(r.error); motivos.push(r.data); render(); return;
  }
  if(t.dataset.rmm){
    const r=await sb.from('motivos').delete().eq('id',t.dataset.rmm);
    if(r.error) return erro(r.error); motivos=motivos.filter(m=>m.id!==t.dataset.rmm); render(); return;
  }
  if(t.id==='addz'){
    const r=await sb.from('pausas').insert({texto:'NOVA PAUSA',ordem:99}).select().single();
    if(r.error) return erro(r.error); pausas.push(r.data); render(); return;
  }
  if(t.dataset.rmz){
    const r=await sb.from('pausas').delete().eq('id',t.dataset.rmz);
    if(r.error) return erro(r.error); pausas=pausas.filter(p=>p.id!==t.dataset.rmz); render(); return;
  }
});

document.addEventListener('change', async e=>{
  const t=e.target;
  if(t.id==='m_div'){
    document.getElementById('m_div2').innerHTML = t.checked
      ? `<div class="two"><div class="fld"><label>2ª forma de pagamento</label><select id="m_pag2">${PAG.map(p=>`<option>${p}</option>`).join('')}</select></div>
         <div class="fld"><label>Valor nessa 2ª forma R$</label><input id="m_val2" inputmode="decimal" placeholder="69,70"></div></div>` : '';
    return;
  }
  if(t.id==='m_mot'){ ctx.motivo=t.value; detFim(); return; }
  if(t.id==='dia'){ dia=t.value; mesPainel=ym(dia); await carregarDia(); render(); return; }
  if(t.id==='mesP'){ mesPainel=t.value; await carregarMes(); render(); return; }
  if(t.dataset.cx){ const o={}; o[t.dataset.cx]=num(t.value); return upsertDia(o); }
  if(t.dataset.am!==undefined){
    const qtd=Math.max(0,parseInt(t.value||'0',10)||0);
    const r=await sb.from('atend_manual').upsert({loja_id:loja,data:dia,vendedora:t.dataset.am,qtd},
      {onConflict:'loja_id,data,vendedora'}).select().single();
    if(r.error) return erro(r.error);
    const i=D.am.findIndex(x=>x.vendedora===t.dataset.am);
    if(i>=0) D.am[i]=r.data; else D.am.push(r.data);
    render(); return;
  }

  if(t.dataset.lj){
    const p=t.dataset.lj.split('.'), o={}; o[p[1]]=num(t.value);
    const r=await sb.from('lojas').update(o).eq('id',p[0]);
    if(r.error) return erro(r.error);
    lojas.find(x=>x.id===p[0])[p[1]]=num(t.value); toast('Meta atualizada'); return;
  }
  if(t.dataset.pn||t.dataset.pm){
    const id=t.dataset.pn||t.dataset.pm, campo=t.dataset.pn?'nome':'meta';
    const val=t.dataset.pn?t.value.toUpperCase().trim():num(t.value), o={}; o[campo]=val;
    const r=await sb.from('pessoas').update(o).eq('id',id);
    if(r.error) return erro(r.error);
    pessoas.find(x=>x.id===id)[campo]=val; if(campo==='nome') render(); return;
  }
  if(t.dataset.mt||t.dataset.ms){
    const id=t.dataset.mt||t.dataset.ms, campo=t.dataset.mt?'texto':'exige_sku';
    const val=t.dataset.mt?t.value.toUpperCase():t.checked, o={}; o[campo]=val;
    const r=await sb.from('motivos').update(o).eq('id',id);
    if(r.error) return erro(r.error);
    motivos.find(x=>x.id===id)[campo]=val; return;
  }
  if(t.dataset.pz2){
    const r=await sb.from('pausas').update({texto:t.value.toUpperCase()}).eq('id',t.dataset.pz2);
    if(r.error) return erro(r.error);
    pausas.find(x=>x.id===t.dataset.pz2).texto=t.value.toUpperCase(); return;
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') fechar();
  if(e.key==='Enter'&&atual==='lancar'&&e.target.closest('.entry')){ const b=document.getElementById('add'); if(b) b.click(); }
});

/* ===================== login ===================== */
document.getElementById('lgo').addEventListener('click',entrar);
document.getElementById('lpw').addEventListener('keydown',e=>{ if(e.key==='Enter') entrar(); });
document.getElementById('lem').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('lpw').focus(); });

function aviso(html){ document.getElementById('lerr').innerHTML='<div class="err">'+html+'</div>'; }

function telaConfig(){
  document.getElementById('lerr').innerHTML=
    `<div class="err">Falta apontar o sistema para o seu projeto do Supabase. Cole os dois valores de
      <b>Settings → API</b>. Eles ficam guardados neste aparelho.</div>
     <div class="fld"><label>URL do projeto</label><input id="cfu" placeholder="https://xxxx.supabase.co" value="${esc(guardado('ana_url'))}"></div>
     <div class="fld"><label>Chave anon public</label><input id="cfk" placeholder="eyJhbGc..." value="${esc(guardado('ana_key'))}"></div>
     <button class="btn" id="cfs" style="width:100%;margin-bottom:14px">Salvar e conectar</button>`;
  document.getElementById('cfs').addEventListener('click',()=>{
    const u=document.getElementById('cfu').value.trim().replace(/\/+$/,'');
    const k=document.getElementById('cfk').value.trim();
    if(!/^https:\/\/.+/.test(u)||!k){ aviso('Preencha os dois campos. A URL começa com https://'); return; }
    guardar('ana_url',u); guardar('ana_key',k);
    SUPABASE_URL=u; SUPABASE_ANON=k;
    partir();
  });
}

async function entrar(){
  if(!sb){ partir(); if(!sb) return; }
  const b=document.getElementById('lgo'); b.disabled=true; b.textContent='Entrando…';
  let r;
  try{
    r=await sb.auth.signInWithPassword({
      email:document.getElementById('lem').value.trim(),
      password:document.getElementById('lpw').value});
  }catch(e){
    b.disabled=false; b.textContent='Entrar';
    aviso('Não deu para falar com o servidor: '+esc(e.message)); return;
  }
  b.disabled=false; b.textContent='Entrar';
  if(r.error){
    aviso(/Invalid/i.test(r.error.message)?'E-mail ou senha não conferem.':esc(r.error.message));
    return;
  }
  iniciarApp();
}

/* liga tudo e diz na tela o que faltou, em vez de morrer em silêncio */
function partir(){
  const s=conectar();
  if(s==='biblioteca'){
    aviso('A biblioteca do Supabase não carregou. Abra pelo endereço da Vercel (não pelo arquivo no computador) e confira se algum bloqueador está barrando o cdn.jsdelivr.net.');
    return;
  }
  if(s==='configurar'){ telaConfig(); return; }
  if(s.indexOf('erro:')===0){ aviso('Endereço ou chave inválidos: '+esc(s.slice(5))); return; }
  document.getElementById('lerr').innerHTML='';
  sb.auth.getSession().then(r=>{ if(r.data.session) iniciarApp(); }).catch(e=>console.error(e));
}

/* ===================== tempo real ===================== */
function ligarCanal(){
  if(canal) sb.removeChannel(canal);
  const bate=p=>((p.new&&p.new.loja_id===loja)||(p.old&&p.old.loja_id===loja));
  canal = sb.channel('salao')
    .on('postgres_changes',{event:'*',schema:'public',table:'fila'},        p=>{ if(bate(p)) recarregar(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'vendas'},      p=>{ if(bate(p)) recarregar(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'atendimentos'},p=>{ if(bate(p)) recarregar(); })
    .on('postgres_changes',{event:'*',schema:'public',table:'caixa_mov'},   p=>{ if(bate(p)) recarregar(); })
    .subscribe();
}

/* ===================== boot ===================== */
async function iniciarApp(){
  try{
    const s=await sb.auth.getUser();
    if(!s.data.user) return;
    await carregarBase();
    const me=pessoas.find(p=>p.user_id===s.data.user.id);
    if(!me){
      document.getElementById('lerr').innerHTML='<div class="err">Login criado, mas ainda não ligado a uma pessoa. Amarre o e-mail em pessoas.user_id.</div>';
      await sb.auth.signOut(); return;
    }
    eu={nome:me.nome,papel:me.papel,loja_id:me.loja_id};
    loja = me.loja_id || (lojas[0]&&lojas[0].id);
    document.getElementById('login').classList.add('off');
    document.getElementById('app').classList.add('on');
    await carregarDia();
    await carregarMes();
    render();
    ligarCanal();
    setInterval(()=>{ if(atual==='fila'&&!MD.classList.contains('on')) render(); },60000);
  }catch(err){
    document.getElementById('lerr').innerHTML='<div class="err">'+esc(err.message||'Falha ao carregar os dados.')+'</div>';
  }
}
partir();
</script>
</html>
